<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ball vs Ball – Chiến Trường</title>
<meta name="theme-color" content="#3a4726">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ball Battle">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --sky-top:#0f6fd0; --sky-bot:#8fd0fb;
    --navy:#0c162d; --ink:#eaf3ff;
    --blue:#3f66d8; --red:#e0323c; --gold:#f4c542;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:#8fd0fb}
  html,body{margin:0;min-height:100%}
  body{
    background:linear-gradient(180deg,var(--sky-top),var(--sky-bot)) fixed;
    font-family:"Avenir Next","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:var(--ink); display:flex; justify-content:center;
    overscroll-behavior:none; user-select:none; -webkit-user-select:none;
  }
  .app{width:100%;max-width:760px;padding:10px 8px 14px;display:flex;flex-direction:column;gap:10px;align-items:center}
  .hidden{display:none !important}

  /* ----- HUD ----- */
  .hud{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .team{display:flex;flex-direction:column;gap:6px}
  .hp{background:rgba(12,22,45,.78);border-radius:12px;padding:7px 10px 8px}
  .team.right .hp{text-align:right}
  .hp .name{font-weight:800;font-size:14px;display:flex;justify-content:space-between;gap:8px}
  .team.right .hp .name{flex-direction:row-reverse}
  .hud.duo .hp{padding:5px 9px 6px}
  .hud.duo .hp .name{font-size:12.5px}
  .hp.dead{opacity:.4}
  .bar{height:9px;border-radius:6px;background:rgba(255,255,255,.14);margin-top:5px;overflow:hidden}
  .hud.duo .bar{height:7px;margin-top:4px}
  .bar i{display:block;height:100%;width:100%;border-radius:6px;transition:width .12s linear}
  .team.blue .bar i{background:linear-gradient(90deg,#6f8dff,var(--blue))}
  .team.red  .bar i{background:linear-gradient(270deg,#ff7b7b,var(--red));margin-left:auto}

  /* ----- Sân đấu ----- */
  .stage{position:relative;line-height:0}
  canvas.arena{display:block;border-radius:14px;box-shadow:0 10px 30px rgba(5,25,60,.35);touch-action:none}
  .overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;background:rgba(6,12,28,.55);border-radius:14px;line-height:1.2;text-align:center;
  }
  .overlay h2{margin:0;font-size:clamp(26px,7vw,44px);font-weight:900;letter-spacing:.5px;text-shadow:0 3px 0 rgba(0,0,0,.45)}
  .overlay .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

  /* ----- Điều khiển ----- */
  .controls{width:100%;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  button{
    font:inherit;font-weight:800;font-size:15px;color:var(--ink);background:transparent;border:0;
    padding:9px 16px;border-radius:9px;cursor:pointer;min-height:40px;
  }
  .cta{background:var(--navy);padding:10px 18px;border-radius:12px;box-shadow:0 3px 0 rgba(0,0,0,.35)}
  .cta:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
  .cta.big{background:var(--gold);color:#2a1d00;font-size:17px;padding:12px 24px}
  .cta:focus-visible,.card:focus-visible{outline:3px solid #fff;outline-offset:2px}

  /* ----- Màn chọn bóng ----- */
  .select{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
  .select h1{margin:6px 0 0;font-size:clamp(26px,7vw,38px);font-weight:900;text-align:center;text-shadow:0 3px 0 rgba(6,30,70,.4)}
  .select h1.blue{color:#cfe0ff} .select h1.red{color:#ffd6d6}
  .select .sub{margin:0;font-weight:700;color:#06224a;text-align:center;font-size:15px}
  .chosen{display:flex;align-items:center;gap:10px;background:rgba(12,22,45,.78);padding:6px 8px 6px 14px;border-radius:12px;font-weight:800;font-size:14px}
  .chosen button{background:var(--gold);color:#2a1d00;padding:6px 12px;min-height:34px;font-size:14px}
  .cards{width:100%;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  @media (min-width:600px){.cards{grid-template-columns:repeat(3,1fr)}}
  .card{
    display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;
    background:rgba(12,22,45,.82);border-radius:16px;padding:10px 10px 12px;
    box-shadow:0 4px 0 rgba(0,0,0,.28);
  }
  .card:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
  .card canvas{width:100%;max-width:150px;aspect-ratio:1;background:radial-gradient(circle,#2a406f 0,#1b2b50 70%);border-radius:12px}
  .card .cname{font-size:19px;font-weight:900;margin-top:4px}
  /* ----- Cài đặt ----- */
  .settings{width:100%;display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:8px}
  .settings h1{margin:6px 0 0;font-size:clamp(28px,8vw,42px);font-weight:900;color:#fff;text-shadow:0 3px 0 rgba(6,30,70,.4)}
  .setcard{width:100%;max-width:420px;background:rgba(12,22,45,.84);border-radius:16px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
  .setlabel{font-weight:800;font-size:15px;color:#cfe0f7}
  .langs{display:flex;gap:8px;flex-wrap:wrap}
  .langs button{background:rgba(255,255,255,.1);padding:10px 20px;border-radius:12px;font-weight:800}
  .langs button.on{background:var(--gold);color:#2a1d00}
  .langs button:focus-visible{outline:3px solid #fff;outline-offset:2px}
  .linkbtn{background:rgba(12,22,45,.55);color:var(--ink);padding:6px 14px;min-height:34px;font-size:14px;border-radius:10px}

  /* ----- Menu chọn chế độ ----- */
  .menu{width:100%;display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:8px}
  .menu h1{margin:6px 0 0;font-size:clamp(34px,10vw,54px);font-weight:900;text-align:center;color:#fff;text-shadow:0 4px 0 rgba(6,30,70,.45)}
  .menu .sub{margin:0;font-weight:700;color:#06224a;text-align:center;font-size:16px}
  .modes{width:100%;display:grid;grid-template-columns:1fr;gap:12px;max-width:520px}
  @media (min-width:600px){.modes{grid-template-columns:1fr 1fr;max-width:none}}
  .mode{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;
    background:rgba(12,22,45,.84);border-radius:18px;padding:18px 14px 20px;box-shadow:0 5px 0 rgba(0,0,0,.3)}
  .mode:active{transform:translateY(2px);box-shadow:0 3px 0 rgba(0,0,0,.3)}
  .mode:focus-visible{outline:3px solid #fff;outline-offset:2px}
  .mode .dots{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
  .mode .dots i{width:36px;height:36px;border-radius:50%;display:inline-block;box-shadow:inset -4px -5px 8px rgba(0,0,0,.35),0 3px 0 rgba(0,0,0,.25)}
  .mode .dots i.b{background:radial-gradient(circle at 35% 30%,#7f9cf0,#1f3da6 60%,#0b1850)}
  .mode .dots i.r{background:radial-gradient(circle at 35% 30%,#ff8c8c,#c4202a 60%,#6a0a12)}
  .mode .dots em{font-style:normal;font-weight:900;color:var(--gold);padding:0 6px;font-size:18px}
  .mode .mname{font-size:26px;font-weight:900}
  .mode .mdesc{font-size:13.5px;font-weight:600;line-height:1.4;color:#cfe0f7;max-width:300px}
  @media (prefers-reduced-motion:reduce){.bar i{transition:none}}
  /* ----- chọn bản đồ ----- */
  .maps{width:100%;max-width:520px;display:flex;flex-direction:column;gap:8px;align-items:center}
  .maps .setlabel{color:#06224a;font-size:16px}
  .maprow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;width:100%}
  .mapbtn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 8px 12px;border-radius:16px;background:rgba(12,22,45,.84);color:#fff;border:3px solid transparent;box-shadow:0 4px 0 rgba(0,0,0,.3);text-align:center}
  .mapbtn canvas{width:100%;max-width:150px;aspect-ratio:1;border-radius:10px;display:block}
  .mapbtn .mn{font-size:17px;font-weight:900}
  .mapbtn small{font-size:12px;font-weight:600;line-height:1.35;color:#cfe0f7}
  .mapbtn.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,211,77,.3),0 4px 0 rgba(0,0,0,.3)}
  .mapbtn:focus-visible{outline:3px solid #fff;outline-offset:2px}
  /* ----- chủ đề bản cập nhật Lửa & Băng ----- */
  .upd{width:100%;max-width:520px;display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:16px;color:#fff;text-align:left;
       background:linear-gradient(100deg,#ff4d1a 0%,#ff9a2e 30%,#4cc3ff 70%,#2a7bff 100%);background-size:200% 100%;animation:updsh 6s ease-in-out infinite alternate;
       box-shadow:0 4px 0 rgba(0,0,0,.28),0 0 24px rgba(255,140,40,.35),0 0 24px rgba(90,200,255,.35)}
  .upd .ic{font-size:30px;line-height:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.3))}
  .upd .tx{flex:1;min-width:0}
  .upd b{display:block;font-size:18px;font-weight:900;letter-spacing:.5px;text-shadow:0 2px 0 rgba(0,0,0,.35)}
  .upd small{display:block;font-size:12.5px;font-weight:700;opacity:.95;line-height:1.35;text-shadow:0 1px 0 rgba(0,0,0,.3)}
  @keyframes updsh{from{background-position:0 0}to{background-position:100% 0}}
  @media (prefers-reduced-motion:reduce){.upd{animation:none}}
  .card{position:relative}
  .card .newtag{position:absolute;top:8px;right:8px;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:900;letter-spacing:.6px;color:#fff;background:linear-gradient(90deg,#ff5a1f,#3aa8ff);box-shadow:0 2px 0 rgba(0,0,0,.3)}

  /* ----- THEME LỬA & BĂNG cho menu / màn chọn bóng ----- */
  html.fi{background:#1a0d2e}
  body.fi{background:linear-gradient(135deg,#3a0a06 0%,#c2310f 18%,#ff8a2a 36%,#5a3a6e 50%,#2f8fd8 64%,#8fe0ff 82%,#e9fbff 100%) fixed;background-size:100% 100%}
  body.fi::before,body.fi::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-repeat:repeat}
  body.fi::before{ /* tro lửa bay lên ở nửa trên-trái */
    -webkit-mask-image:linear-gradient(135deg,#000 0%,#000 42%,transparent 55%);mask-image:linear-gradient(135deg,#000 0%,#000 42%,transparent 55%);
    background-image:radial-gradient(circle,#ffd27a 0 2px,transparent 3px),radial-gradient(circle,#ff8a2a 0 1.5px,transparent 2.5px),radial-gradient(circle,#fff3c4 0 1px,transparent 2px);
    background-size:140px 170px,95px 130px,60px 80px;background-position:0 0,40px 60px,20px 30px;animation:fiEmber 9s linear infinite}
  body.fi::after{ /* tuyết rơi ở nửa dưới-phải */
    -webkit-mask-image:linear-gradient(135deg,transparent 45%,#000 58%,#000 100%);mask-image:linear-gradient(135deg,transparent 45%,#000 58%,#000 100%);
    background-image:radial-gradient(circle,#fff 0 2.5px,transparent 3.5px),radial-gradient(circle,#dff6ff 0 1.8px,transparent 2.8px),radial-gradient(circle,#fff 0 1px,transparent 2px);
    background-size:150px 150px,100px 120px,64px 70px;background-position:0 0,30px 50px,10px 20px;animation:fiSnow 12s linear infinite}
  @keyframes fiEmber{from{background-position:0 0,40px 60px,20px 30px}to{background-position:30px -170px,10px -130px,50px -80px}}
  @keyframes fiSnow{from{background-position:0 0,30px 50px,10px 20px}to{background-position:-30px 150px,10px 120px,-20px 70px}}
  body.fi .app{position:relative;z-index:1}
  body.fi .menu h1{background:linear-gradient(90deg,#ff5a1f 0%,#ffc247 30%,#ffffff 50%,#7fd4ff 70%,#2a7bff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 4px 0 rgba(10,10,40,.55)) drop-shadow(0 0 14px rgba(255,255,255,.35))}
  body.fi .menu .sub,body.fi .select .sub,body.fi .maps .setlabel{color:#fff;text-shadow:0 2px 0 rgba(10,10,40,.55)}
  body.fi .select h1{color:#fff}
  body.fi .mode,body.fi .mapbtn,body.fi .card,body.fi .setcard{background:rgba(14,12,38,.80);border:2px solid transparent;background-clip:padding-box;
    box-shadow:0 5px 0 rgba(0,0,0,.3),0 0 0 2px rgba(255,255,255,.08)}
  body.fi .mode:first-child{box-shadow:0 5px 0 rgba(0,0,0,.3),0 0 18px rgba(255,120,40,.45)}
  body.fi .mode:last-child{box-shadow:0 5px 0 rgba(0,0,0,.3),0 0 18px rgba(90,200,255,.45)}
  body.fi .mapbtn.on{border-color:var(--gold)}
  body.fi .linkbtn{background:rgba(14,12,38,.7)}
  @media (prefers-reduced-motion:reduce){body.fi::before,body.fi::after{animation:none}}

  /* ----- THEME CHIẾN TRƯỜNG (bản cập nhật Trapper & Soldier) ----- */
  .tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .tabs button{font:inherit;font-weight:900;font-size:14px;padding:8px 14px;border-radius:999px;border:2px solid rgba(255,255,255,.35);background:rgba(14,12,38,.6);color:#fff;cursor:pointer}
  .tabs button.on{background:#fff;color:#16203a;border-color:#fff}
  html.war{background:#1b2214}
  body.war{background:radial-gradient(ellipse 300px 190px at 12% 16%,#4a5a2c 0 62%,transparent 63%),radial-gradient(ellipse 340px 200px at 88% 22%,#2f3a20 0 62%,transparent 63%),radial-gradient(ellipse 280px 170px at 30% 78%,#5b6b36 0 62%,transparent 63%),radial-gradient(ellipse 360px 210px at 80% 86%,#3a4726 0 62%,transparent 63%),radial-gradient(ellipse 220px 140px at 55% 48%,#6a5a35 0 62%,transparent 63%),#222a18 fixed}
  body.war::before{-webkit-mask-image:none;mask-image:none;animation:none;background:repeating-linear-gradient(45deg,transparent 0 14px,rgba(0,0,0,.10) 14px 15px),radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.6) 100%);background-size:auto;background-position:0 0}
  body.war::after{-webkit-mask-image:none;mask-image:none;background:linear-gradient(100deg,transparent 40%,rgba(255,238,170,.14) 50%,transparent 60%);background-size:260% 100%;background-position:0 0;animation:warSweep 8s linear infinite}
  @keyframes warSweep{from{background-position:130% 0}to{background-position:-30% 0}}
  body.war .menu h1{background:linear-gradient(90deg,#d9c36a,#fff3c4 50%,#e8913c);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px;filter:drop-shadow(0 4px 0 rgba(10,14,6,.7))}
  body.war .upd{background:linear-gradient(100deg,#4d5a2a,#7a8a3c 55%,#c47a2a);animation:none;box-shadow:0 4px 0 rgba(0,0,0,.35),0 0 22px rgba(230,170,70,.35)}
  body.war .mode,body.war .mapbtn,body.war .card,body.war .setcard,body.war .linkbtn{background:rgba(24,30,16,.85);box-shadow:0 5px 0 rgba(0,0,0,.35),0 0 0 2px rgba(220,200,120,.25)}
  body.war .mode:first-child{box-shadow:0 5px 0 rgba(0,0,0,.35),0 0 18px rgba(255,170,60,.45)}
  body.war .mode:last-child{box-shadow:0 5px 0 rgba(0,0,0,.35),0 0 18px rgba(170,200,90,.45)}
  body.war .card .newtag{background:linear-gradient(90deg,#c47a2a,#8aa13c)}
  body.war .tabs button.on{background:#e6d27a;color:#1c2410;border-color:#e6d27a}
  @media (prefers-reduced-motion:reduce){body.war::after{animation:none}}
  .tabs{display:none}
</style>
</head>
<body>
<div class="app">

  <!-- Menu chọn chế độ -->
  <section class="menu hidden" id="menu">
    <h1>Ball vs Ball</h1>
    <div class="tabs" id="themeTabs"><button type="button" data-th="fi">🔥❄️ Lửa &amp; Băng</button><button type="button" data-th="war">🪖 Chiến Trường</button></div>
    <div class="upd" id="updBanner"><span class="ic">🔥</span><div class="tx"><b data-i18n="updTitle">CẬP NHẬT LỬA &amp; BĂNG</b><small data-i18n="updSub">2 bóng mới</small></div><span class="ic">❄️</span></div>
    <p class="sub" data-i18n="menuSub">Chọn chế độ chơi</p>
    <div class="modes">
      <button class="mode" id="mode1" data-mode="1v1">
        <span class="dots"><i class="b"></i><em>VS</em><i class="r"></i></span>
        <span class="mname">1 vs 1</span>
        <span class="mdesc" data-i18n="mode1Desc">Một bóng xanh đấu một bóng đỏ.</span>
      </button>
      <button class="mode" id="mode2" data-mode="2v2">
        <span class="dots"><i class="b"></i><i class="b"></i><em>VS</em><i class="r"></i><i class="r"></i></span>
        <span class="mname">2 vs 2</span>
        <span class="mdesc" data-i18n="mode2Desc">Hai bóng xanh đấu hai bóng đỏ. Chọn lần lượt từng bóng, đồng đội không gây sát thương cho nhau.</span>
      </button>
    </div>
    <div class="maps">
      <div class="setlabel" data-i18n="mapLabel">Bản đồ</div>
      <div class="maprow" id="mapRow"></div>
    </div>
    <button class="linkbtn" id="openSettings" data-i18n="settingsBtn">Cài đặt</button>
  </section>

  <!-- Cài đặt (ngôn ngữ) -->
  <section class="settings hidden" id="settings">
    <h1 data-i18n="settings">Cài đặt</h1>
    <div class="setcard">
      <div class="setlabel" data-i18n="language">Ngôn ngữ</div>
      <div class="langs" id="langs"></div>
    </div>
    <button class="linkbtn" id="setBack" data-i18n="back">← Quay lại</button>
  </section>

  <!-- Màn chọn bóng: chọn lần lượt từng bóng -->
  <section class="select hidden" id="select">
    <h1 id="selTitle" class="blue">Chọn bóng xanh</h1>
    <p class="sub" id="selSub">Bước 1/2 · bóng đỏ sẽ chọn sau</p>
    <button class="linkbtn" id="selMode" data-i18n="selMode">← Đổi chế độ</button>
    <div class="chosen hidden" id="chosen"><span id="chosenText"></span><button id="selBack" data-i18n="selBack">Chọn lại</button></div>
    <div class="cards" id="cards"></div>
  </section>

  <!-- Trận đấu -->
  <div class="hud hidden" id="hud">
    <div class="team blue" id="hudBlue"></div>
    <div class="team red right" id="hudRed"></div>
  </div>

  <div class="stage hidden" id="stage">
    <canvas class="arena" id="cv"></canvas>
    <div class="overlay hidden" id="overlay">
      <h2 id="winText">Xanh thắng!</h2>
      <div class="btns">
        <button class="cta big" id="again" data-i18n="again">Chơi lại</button>
        <button class="cta big" id="reselect2" data-i18n="reselect">Chọn lại bóng</button>
        <button class="cta big" id="toMenu2" data-i18n="toMenu">Đổi chế độ</button>
      </div>
    </div>
  </div>

  <div class="controls hidden" id="controls">
    <button class="cta" id="restart" data-i18n="restart">Bắt đầu lại</button>
    <button class="cta" id="reselect" data-i18n="reselect">Chọn lại bóng</button>
    <button class="cta" id="toMenu" data-i18n="toMenu">Đổi chế độ</button>
    <button class="cta" id="speed">Tốc độ x1</button>
    <button class="cta" id="sound">Âm thanh: bật</button>
  </div>
</div>

<script>
(() => {
'use strict';

/* =====================================================================
   CẤU HÌNH
   ===================================================================== */
const W = 680, H = 680;                               // kích thước logic của canvas
const A = { x0: 60, y0: 60, x1: 620, y1: 620 };       // vùng bóng được di chuyển
const R = 32;                                         // bán kính bóng
const BASE_SPEED = 320;                               // tốc độ bóng (px/giây)
const BULLET_SPEED = 560;
const SAW_R = 38;                                     // bán kính đĩa cưa
const BOOM_SPEED = 520, BOOM_R = 72;
const FAN_R = 38, TORN_R = 76, TORN_PULL = 230;       // bán kính quạt, lốc xoáy, vùng hút (lốc xoáy đã tăng ~35%: gốc 56 và 170)
// Hồi chiêu (giây): chỉ bắt đầu đếm SAU KHI chiêu trước đã kết thúc hẳn
const CD = { sword: 5, gun: 4.5, saw: 5, shield: 6, fan: 4.5 };
const SAW_BIG_T = 1.6, AURA_T = 2.5, TORN_LIFE = 2.8;  // thời gian chiêu hoạt động
const SCYTHE_HITS = 2;                                 // chém trúng 2 lần, đếm ngược 2 giây rồi tỏa sóng máu

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const angDiff = (a, b) => { let d = a - b; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };
function segDist(px, py, x1, y1, x2, y2) {
  const vx = x2 - x1, vy = y2 - y1;
  const t = clamp(((px - x1) * vx + (py - y1) * vy) / (vx * vx + vy * vy || 1), 0, 1);
  const cx = x1 + vx * t, cy = y1 + vy * t;
  return { d: Math.hypot(px - cx, py - cy), cx, cy };
}
function segInter(a, b, c, d, e, f, g, h) {
  const den = (c - a) * (h - f) - (d - b) * (g - e);
  if (Math.abs(den) < 1e-9) return null;
  const t = ((e - a) * (h - f) - (f - b) * (g - e)) / den;
  const u = ((e - a) * (d - b) - (f - b) * (c - a)) / den;
  return (t >= 0 && t <= 1 && u >= 0 && u <= 1) ? { x: a + t * (c - a), y: b + t * (d - b) } : null;
}

const ICE_SWORD_LEN = 92, ICE_SWORD_MUL = 0.8;            // kiếm băng của Bóng Băng: hơi ngắn hơn và yếu hơn kiếm thường (80% sát thương)

/* =====================================================================
   HIỆU ỨNG / SÁT THƯƠNG
   ===================================================================== */
function burst(x, y, n, col, spd = 220, life = 0.5) {
  if (parts.length > 700) return;                        // trần số hạt: tránh giật khi nhiều hiệu ứng chồng nhau
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(spd * 0.25, spd);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.4, 1) * life, max: life, col, size: rand(1.5, 3.6) });
  }
}
function floatText(x, y, text, col) {
  texts.push({ x, y, vy: -70, text, col, life: 0.9, max: 0.9 });
}

function hurt(t, dmg, px, py, snd, pierce) {
  if (!t.alive || state !== 'play') return;
  if (!pierce && t.type === 'shield' && t.aura > 0) dmg = Math.max(1, Math.round(dmg * 0.33));   // vòng bảo vệ giảm 67% sát thương
  if (!pierce && t.type === 'bolt' && t.boltPhase === 'dash') dmg = Math.round(dmg * DASH_DMG_TAKEN * 100) / 100;   // Gia Tốc Lôi: không còn miễn nhiễm, chỉ giảm 55% sát thương nhận vào
  t.hp = Math.max(0, t.hp - dmg);
  t.flash = 0.12;
  floatText(t.x + rand(-14, 14), t.y - t.r - 6, '-' + dmg, '#ff2b2b');
  burst(px ?? t.x, py ?? t.y, 8, '#ffd9a0', 200, 0.35);
  shake = Math.min(shake + dmg * 0.7, 9);
  Snd.play(snd || 'hit');
  if (t.hp <= 0) {
    t.alive = false;
    burst(t.x, t.y, 70, PALETTE[t.side].hi, 420, 0.9);
    burst(t.x, t.y, 30, '#ffffff', 300, 0.6);
    shake = 14;
    Snd.play('ko');
    if (!balls.some(x => x.side === t.side && x.alive)) { state = 'ko'; timeScale = 0.25; koTimer = 1.5; }   // cả đội gục mới hết trận
  }
}
function heal(b, amt) {
  if (!b.alive || amt <= 0 || state !== 'play') return;
  b.hp = Math.min(b.maxhp, b.hp + amt);

function knock(t, nx, ny, force) { t.vx += nx * force; t.vy += ny * force; }

/* ---- đội & mục tiêu (dùng chung cho 1v1 và 2v2) ---- */
const liveFoes = b => balls.filter(x => x.side !== b.side && x.alive);

    if (o.side === b.side || !o.alive) continue;
    const d = Math.hypot(o.x - x, o.y - y);

/* ---- khiên ---- */

/* ---- hình học vũ khí ---- */
function loc(b, lx, ly) {

}

/* =====================================================================

function shuffled(arr) {                                 // Fisher–Yates (thay cho sort(() => Math.random() - 0.5) vốn thiên lệch)

/* ---- Bóng Lửa ---- */
function updateFire(b, e, dt) {                          // chiêu ngẫu nhiên: Hỏa Cầu (55%) hoặc Hỏa Long Phá Thiên (45%)

      else {
        const a = Math.atan2(e.y - b.y, e.x - b.x);       // lao thẳng vào đối thủ ngay khi kích hoạt
        b.vx = Math.cos(a) * FIRE_RUSH_SPEED; b.vy = Math.sin(a) * FIRE_RUSH_SPEED;
        b.skPhase = 'rush'; b.skT = FIRE_RUSH_MAX;
        floatText(clamp(b.x, 170, 510), b.y - b.r - 30, T('f_firerush'), '#ffb070');
        burst(b.x, b.y, 26, '#ffb347', 520, 0.5); shake = Math.min(shake + 5, 10);
        Snd.play('firerush');
      }
    }
    return;
  }
  if (b.skPhase === 'cast') { if (b.skT <= 0) { b.skPhase = 'cool'; b.skT = FIRE_CD; } return; }
  if (b.skPhase === 'charge') {                          // lửa từ bốn phía dồn vào bóng
    for (let k = 0; k < 3; k++) {
      const a = rand(0, Math.PI * 2), d = rand(80, 135), life = 0.32;
      parts.push({ x: b.x + Math.cos(a) * d, y: b.y + Math.sin(a) * d, vx: -Math.cos(a) * d / life, vy: -Math.sin(a) * d / life, life, max: life, col: Math.random() < 0.5 ? '#ff8a1a' : '#ffd34a', size: rand(3, 6.5) });
    }
    if (!e.alive) { b.skPhase = 'cool'; b.skT = FIRE_CD; return; }
    if (b.skT <= 0) {
      const a = Math.atan2(e.y - b.y, e.x - b.x);
      b.vx = Math.cos(a) * FIRE_RUSH_SPEED; b.vy = Math.sin(a) * FIRE_RUSH_SPEED;
      b.skPhase = 'rush'; b.skT = FIRE_RUSH_MAX;
      burst(b.x, b.y, 26, '#ffb347', 520, 0.5); shake = Math.min(shake + 5, 10);
      Snd.play('firerush');
    }
    return;
  }
  if (b.skPhase === 'rush') {
    if (e.alive && b.skT > FIRE_RUSH_MAX - 0.55) {       // bẻ hướng nhẹ về phía đối thủ lúc đầu cú lao
      const sp = Math.hypot(b.vx, b.vy), cur = Math.atan2(b.vy, b.vx), want = Math.atan2(e.y - b.y, e.x - b.x);
      const nw = cur + clamp(angDiff(want, cur), -4 * dt, 4 * dt); b.vx = Math.cos(nw) * sp; b.vy = Math.sin(nw) * sp;
    }
    for (let k = 0; k < 2; k++) parts.push({ x: b.x + rand(-10, 10), y: b.y + rand(-10, 10), vx: rand(-60, 60), vy: rand(-60, 60), life: 0.4, max: 0.4, col: Math.random() < 0.5 ? '#ff7a1a' : '#ffd34a', size: rand(3, 7) });
    let hit = null;
    for (const t of liveFoes(b)) if (Math.hypot(t.x - b.x, t.y - b.y) < b.r + t.r + 2) { hit = t; break; }
    if (hit) rushHit(b, hit); else if (b.skT <= 0) endRush(b);
    return;
  }
  if (b.skPhase === 'latch') {                           // dính vào đối thủ 0,25 giây, lửa dồn vào rồi hất văng
    const t = b.latchT;
    if (!t || !t.alive) { endRush(b); return; }
    t.vx = t.vy = 0; t.holdT = Math.max(t.holdT || 0, 0.05);
    b.x = t.x - b.lnx * (b.r + t.r - 4); b.y = t.y - b.lny * (b.r + t.r - 4); b.vx = b.vy = 0;
    for (let k = 0; k < 4; k++) {
      const a = rand(0, Math.PI * 2), d = rand(70, 130), life = 0.2;
      parts.push({ x: t.x + Math.cos(a) * d, y: t.y + Math.sin(a) * d, vx: -Math.cos(a) * d / life, vy: -Math.sin(a) * d / life, life, max: life, col: Math.random() < 0.5 ? '#ff8a1a' : '#ffd34a', size: rand(3, 6.5) });
    }
    if (b.skT <= 0) {
      const nx = b.lnx, ny = b.lny;
      t.holdT = 0;
      hurt(t, FIRE_RUSH_DMG, (b.x + t.x) / 2, (b.y + t.y) / 2, 'firehit'); b.hits++;   // hất văng: 21,5 sát thương
      t.vx = nx * FIRE_PUSH; t.vy = ny * FIRE_PUSH;
      const mx = (b.x + t.x) / 2, my = (b.y + t.y) / 2;
      blasts.push({ x: mx, y: my, r0: 10, r: 10, max: 120, t: 0, p: 0, dur: 0.6, col: 'mine', seed: Math.floor(rand(1, 99999)) });
      burst(mx, my, 40, '#ffb347', 620, 0.7); burst(mx, my, 14, '#ffffff', 420, 0.35);
      shake = Math.min(shake + 10, 14);
      Snd.play('firehit');
      b.vx = -nx * b.spd; b.vy = -ny * b.spd; b.latchT = null;
      b.skPhase = 'cool'; b.skT = FIRE_CD; knock(b, -nx, -ny, 260);
    }
  }
}
function endRush(b) {
  const m = Math.hypot(b.vx, b.vy) || 1;
  b.vx = b.vx / m * b.spd; b.vy = b.vy / m * b.spd;     // trả về tốc độ thường, giữ hướng
  b.skPhase = 'cool'; b.skT = FIRE_CD;
}
function rushHit(b, t) {
  let nx = t.x - b.x, ny = t.y - b.y; const m = Math.hypot(nx, ny) || 1; nx /= m; ny /= m;
  if (shieldHolds(t, b.x, b.y)) {                        // khiên chặn đứng cú lao
    drainGuard(t, 45); Snd.play('block'); burst(b.x, b.y, 14, '#cfe0ff', 300, 0.35);
    endRush(b); knock(b, -nx, -ny, 320); return;
  }
  b.skPhase = 'latch'; b.skT = FIRE_LATCH; b.latchT = t; b.lnx = nx; b.lny = ny; b.vx = b.vy = 0;   // dính vào đối thủ
  hurt(t, FIRE_LATCH_DMG, (b.x + t.x) / 2, (b.y + t.y) / 2, 'burn'); b.hits++;                       // 0,5 sát thương lúc dính
  t.holdT = FIRE_LATCH; t.vx = t.vy = 0;
  burst(t.x, t.y, 18, '#ffb347', 300, 0.35);
  Snd.play('firecharge');
}
function castFireball(b, e) {
  const a = Math.atan2(e.y - b.y, e.x - b.x), reach = b.r + FIREBALL_R * 0.6;
  fireballs.push({ x: b.x + Math.cos(a) * reach, y: b.y + Math.sin(a) * reach, vx: Math.cos(a) * FIREBALL_SPEED, vy: Math.sin(a) * FIREBALL_SPEED, owner: b, life: 3, t: 0 });
  floatText(clamp(b.x, 170, 510), b.y - b.r - 30, T('f_fireball'), '#ffb070');
  burst(b.x + Math.cos(a) * reach, b.y + Math.sin(a) * reach, 16, '#ffb347', 340, 0.4);
  knock(b, -Math.cos(a), -Math.sin(a), 90);

function ignite(t) { const fresh = t.burnT <= 0; t.burnT = BURN_T; if (fresh) t.burnTick = BURN_GAP; }
function updateFireballs(dt) {
  for (let i = fireballs.length - 1; i >= 0; i--) {
    const f = fireballs[i]; f.t += dt; f.life -= dt;
    f.x += f.vx * dt; f.y += f.vy * dt;
    for (let k = 0; k < 2; k++) parts.push({ x: f.x - f.vx * 0.04 + rand(-14, 14), y: f.y - f.vy * 0.04 + rand(-14, 14), vx: rand(-40, 40) - f.vx * 0.1, vy: rand(-40, 40) - f.vy * 0.1, life: 0.5, max: 0.5, col: Math.random() < 0.5 ? '#ff7a1a' : '#ffcf4a', size: rand(3, 8) });
    let dead = f.life <= 0 || f.x < A.x0 - 40 || f.x > A.x1 + 40 || f.y < A.y0 - 40 || f.y > A.y1 + 40;
    if (!dead) {
      for (const t of liveFoes(f.owner)) {

        else {
          hurt(t, FIREBALL_DMG, f.x, f.y, 'flame');
          if (!isBeamForm(t)) ignite(t);

        }

        scorches.push({ x: f.x, y: f.y, max: 48, t: 0, seed: Math.floor(rand(1, 99999)) }); if (scorches.length > 22) scorches.shift();

/* ---- Bóng Băng ---- */
function projBlocked(t, x, y, bw) {                      // vũ khí / khiên của đối thủ chặn đạn nhỏ
  if (t.type === 'sword' || t.type === 'ice' || t.type === 'scythe') { for (const sg of weaponSegs(t)) if (segDist(x, y, sg[0], sg[1], sg[2], sg[3]).d < bw) return 'weapon'; }
  if (t.type === 'fan' && t.stuckT <= 0) { const [fx, fy] = fanPos(t); if (Math.hypot(x - fx, y - fy) < FAN_R + 6) return 'weapon'; }
  if (t.type === 'saw' && t.stuckT <= 0) { const [sx, sy] = sawPos(t); if (Math.hypot(x - sx, y - sy) < sawR(t) + 5) return 'weapon'; }
  if (t.type === 'shield' && Math.hypot(x - t.x, y - t.y) < t.r + 38 && shieldHolds(t, x, y)) return 'shield';
  return null;
}
function updateIce(b, e, dt) {                           // chiêu ngẫu nhiên: Tinh Thể Băng hoặc Vạn Lý Băng Phong; mỗi chiêu có thời gian hồi RIÊNG
  b.skT -= dt;
  b.iceShardT = Math.max(0, (b.iceShardT ?? 0) - dt);     // hồi chiêu Tinh Thể Băng (3 giây sau khi loạt kết thúc)
  b.iceFrostT = Math.max(0, (b.iceFrostT ?? 0) - dt);     // hồi chiêu Vạn Lý Băng Phong (1,8 giây sau khi chiêu kết thúc)
  if (b.skPhase === 'cool') {
    if (b.skT <= 0 && e.alive) {
      const zoneOk = b.iceFrostT <= 0 && e.frozenT <= 0 && e.freezeImm <= 0 && !isBeamForm(e) && !frostZones.some(z => z.owner === b) && Math.hypot(e.x - b.x, e.y - b.y) < FROST_R + 20;
      const shardOk = b.iceShardT <= 0;
      if (zoneOk && (!shardOk || Math.random() < 0.5)) { castFrost(b, e); b.skPhase = 'cast'; b.skT = 0.85; b.vx = b.vy = 0; }
      else if (shardOk) {
        b.skPhase = 'shards'; b.skT = ICE_BURST_T; b.shardCd = 0;
        floatText(clamp(b.x, 170, 510), b.y - b.r - 30, T('f_iceshard'), '#bfeaff');
        Snd.play('icecast');
      }
    }
    return;
  }
  if (b.skPhase === 'cast') {
    b.vx = b.vy = 0;                                     // đứng im trong lúc tung chiêu
    if (b.skT <= 0) { const a = rand(0, Math.PI * 2); b.vx = Math.cos(a) * b.spd; b.vy = Math.sin(a) * b.spd; b.skPhase = 'cool'; b.skT = 0.5; b.iceFrostT = ICE_CD; }   // xong chiêu mới di chuyển, đối thủ vẫn đang bị đóng băng
    return;
  }
  if (b.skPhase === 'shards') {                          // bắn loạn xạ mọi hướng, không nhắm vào đối thủ
    b.shardCd -= dt;
    while (b.shardCd <= 0) { b.shardCd += ICE_SHARD_GAP; fireShard(b); }
    if (b.skT <= 0) { b.skPhase = 'cool'; b.skT = 0.5; b.iceShardT = ICE_SHARD_CD; }
  }
}

function fireShard(b) {
  const a = rand(0, Math.PI * 2), sp = rand(ICE_SHARD_SPEED[0], ICE_SHARD_SPEED[1]);
  crystals.push({ x: b.x + Math.cos(a) * (b.r + 6), y: b.y + Math.sin(a) * (b.r + 6), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, owner: b, life: 2.4, bounces: 2, rot: rand(0, 6.28), spin: rand(-6, 6) });
  Snd.play('iceshard');
}
function updateCrystals(dt) {
  for (let i = crystals.length - 1; i >= 0; i--) {
    const c = crystals[i]; c.life -= dt; c.rot += c.spin * dt;
    c.x += c.vx * dt; c.y += c.vy * dt;
    let dead = c.life <= 0;
    if (c.x < A.x0) { c.x = A.x0; c.vx = Math.abs(c.vx); if (c.bounces-- <= 0) dead = true; }
    else if (c.x > A.x1) { c.x = A.x1; c.vx = -Math.abs(c.vx); if (c.bounces-- <= 0) dead = true; }
    if (c.y < A.y0) { c.y = A.y0; c.vy = Math.abs(c.vy); if (c.bounces-- <= 0) dead = true; }
    else if (c.y > A.y1) { c.y = A.y1; c.vy = -Math.abs(c.vy); if (c.bounces-- <= 0) dead = true; }
    if (dead) { burst(c.x, c.y, 5, '#d6f3ff', 140, 0.25); crystals.splice(i, 1); continue; }
    for (const t of liveFoes(c.owner)) {
      const blk = projBlocked(t, c.x, c.y, 9);
      if (blk === 'weapon') { burst(c.x, c.y, 8, '#e6f8ff', 220, 0.3); Snd.play('icehit'); dead = true; break; }
      if (blk === 'shield') { drainGuard(t, 12); burst(c.x, c.y, 8, '#cfe0ff', 200, 0.3); Snd.play('block'); dead = true; break; }
      if (Math.hypot(t.x - c.x, t.y - c.y) < t.r + 7) {
        hurt(t, ICE_SHARD_DMG, c.x, c.y, 'icehit'); c.owner.hits++;
        burst(c.x, c.y, 9, '#d6f3ff', 240, 0.35); dead = true; break;
      }
    }
    if (dead) crystals.splice(i, 1);
  }
}
function castFrost(b, e) {                               // Vạn Lý Băng Phong: vùng băng hiện ra dưới chân đối thủ sau thời gian báo trước
  frostZones.push({ x: b.x, y: b.y, rad: 1, owner: b, t: 0, on: false, tickT: 1, seed: Math.floor(rand(1, 99999)) });
  floatText(clamp(b.x, 170, 510), b.y - b.r - 30, T('f_frost'), '#bfeaff');
  Snd.play('frostcast');
}
function updateFrost(dt) {                              // vùng băng mọc ra từ chính bóng băng, lan tỏa ra rồi bám theo bóng
  for (let i = frostZones.length - 1; i >= 0; i--) {
    const z = frostZones[i]; z.t += dt;
    if (z.t >= FROST_LIFE || !z.owner.alive) { frostZones.splice(i, 1); continue; }
    const k = Math.min(1, z.t / FROST_SPREAD); z.rad = Math.max(1, FROST_R * (1 - Math.pow(1 - k, 3)));
    if (!z.on) { z.on = true; z.tickT = 1; burst(z.x, z.y, 40, '#d6f3ff', 520, 0.7); shake = Math.min(shake + 6, 10); }
    z.tickT -= dt; const tick = z.tickT <= 0; if (tick) z.tickT += 1;
    for (const e of liveFoes(z.owner)) {
      if (isBeamForm(e)) continue;
      if (Math.hypot(e.x - z.x, e.y - z.y) > z.rad + e.r * 0.3) continue;
      if (e.frozenT <= 0) {
        if (e.freezeImm > 0) continue;
        burst(e.x, e.y, 22, '#bfe9ff', 320, 0.5); Snd.play('freeze');
      }
      e.frozenT = Math.max(e.frozenT, 0.15);
      if (tick) hurt(e, FROST_DMG, e.x, e.y, 'icehit');  // -1 máu mỗi giây
    }
  }
}

function mysteryRoll(b, t) {                             // mỗi lần chạm: 2% tung xung lực kết liễu thẳng (xuyên mọi giảm sát thương: vòng bảo vệ của khiên, Gia Tốc Lôi)
  if (!t.alive || state !== 'play') return;

  burst(mx, my, 4, '#c7a6ff', 160, 0.3);                 // tia sáng nhỏ báo hiệu mỗi lần "quay số"
  if (Math.random() >= MYSTERY_P) return;
  let nx = t.x - b.x, ny = t.y - b.y; const m = Math.hypot(nx, ny) || 1; nx /= m; ny /= m;
  const ang = Math.atan2(ny, nx);
  blasts.push({ x: mx, y: my, r0: 10, r: 10, max: 170, t: 0, p: 0, dur: 0.6, col: 'pulse', ang });
  for (let i = 0; i < 46; i++) {                         // mảnh năng lượng phun mạnh theo hướng xung lực
    const a = ang + rand(-0.5, 0.5), sp = rand(320, 980);
    parts.push({ x: t.x, y: t.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.35, 0.8), max: 0.8, col: Math.random() < 0.55 ? '#c7a6ff' : '#ffffff', size: rand(2, 5.5) });
  }
  burst(t.x, t.y, 30, '#c7a6ff', 420, 0.6);
  knock(b, -nx, -ny, PULSE_RECOIL);                      // phản lực nhẹ lên chính bóng "?"
  floatText(clamp(t.x, 150, 530), t.y - t.r - 34, T('f_exec'), '#e6d4ff');

function netZap(b) {                                     // điện giật của lưới
  if (!b.alive || isBeamForm(b)) return;
  hurt(b, NET_ZAP_DMG, b.x, b.y, 'zap');
  burst(b.x, b.y, 8, '#bfe9ff', 260, 0.3);
}

function step(dt) {
  clashCd = Math.max(0, clashCd - dt);
  const frozen = state === 'over' || state === 'ready';

  if (!frozen) {
    for (const b of balls) {
      if (!b.alive) continue;
      b.flash = Math.max(0, b.flash - dt);
      b.contactCd = Math.max(0, b.contactCd - dt);
      b.swordCd = Math.max(0, b.swordCd - dt);
      b.muzzle = Math.max(0, b.muzzle - dt);

      if (b.netT > 0) {                                  // dính lưới điện: giật theo nhịp
        b.netT -= dt; b.netTick -= dt;
        if (b.netTick <= 0) { b.netTick += NET_ZAP_GAP; netZap(b); }
      }
      if (b.burnT > 0) {                                 // đang cháy: mất máu theo nhịp + bốc lửa
        b.burnT -= dt; b.burnTick -= dt;
        if (isBeamForm(b)) b.burnT = 0;
        else {
          if (b.burnTick <= 0) { b.burnTick += BURN_GAP; hurt(b, BURN_DMG, b.x, b.y, 'burn'); }
          if (Math.random() < 0.7) parts.push({ x: b.x + rand(-b.r * 0.7, b.r * 0.7), y: b.y + rand(-b.r * 0.4, b.r * 0.6), vx: rand(-20, 20), vy: rand(-110, -50), life: 0.45, max: 0.45, col: Math.random() < 0.5 ? '#ff8a1a' : '#ffd34a', size: rand(2, 4.5) });
        }
      }
      if (b.trapImm > 0) b.trapImm -= dt;
      if (b.stuckT > 0) {                                // dính bẫy gấu: đứng im
        b.stuckT -= dt; b.vx = b.vy = 0;
        if (b.stuckT <= 0) b.trapImm = TRAP_IMMUNE;
        continue;
      }
      if (b.freezeImm > 0) b.freezeImm -= dt;
      if (b.holdT > 0) { b.holdT -= dt; b.vx = b.vy = 0; continue; }          // bị bóng lửa ôm dính: đứng im 0,25 giây
      if (b.frozenT > 0) {                               // bị đóng băng: đứng im (vũ khí và chiêu vẫn dùng được)
        b.frozenT -= dt; b.vx = b.vy = 0;
        if (b.frozenT <= 0) b.freezeImm = FROST_IMMUNE;
        continue;
      }
      if (b.type === 'ice' && b.skPhase === 'cast') { b.vx = b.vy = 0; continue; }   // Vạn Lý Băng Phong: bóng băng dừng lại rồi mới ra chiêu
      if (b.type === 'fire' && b.skPhase === 'latch') { b.vx = b.vy = 0; continue; }
      if (b.type === 'fire' && (b.skPhase === 'charge' || b.skPhase === 'rush')) {   // Hỏa Long Phá Thiên: đứng dồn lửa rồi lao thẳng
        if (b.skPhase === 'charge') b.vx = b.vy = 0;
        b.x += b.vx * dt; b.y += b.vy * dt;
        if (b.x - b.r < A.x0 || b.x + b.r > A.x1 || b.y - b.r < A.y0 || b.y + b.r > A.y1) {
          b.x = clamp(b.x, A.x0 + b.r, A.x1 - b.r); b.y = clamp(b.y, A.y0 + b.r, A.y1 - b.r);
          if (b.skPhase === 'rush') b.skT = 0;           // đâm tường: kết thúc cú lao
        }
        continue;
      }
      // di chuyển + nảy tường
      b.x += b.vx * dt; b.y += b.vy * dt;
      let wall = false;
      if (b.x - b.r < A.x0) { b.x = A.x0 + b.r; b.vx = Math.abs(b.vx); wall = true; }
      if (b.x + b.r > A.x1) { b.x = A.x1 - b.r; b.vx = -Math.abs(b.vx); wall = true; }
      if (b.y - b.r < A.y0) { b.y = A.y0 + b.r; b.vy = Math.abs(b.vy); wall = true; }
      if (b.y + b.r > A.y1) { b.y = A.y1 - b.r; b.vy = -Math.abs(b.vy); wall = true; }
      if (wall) Snd.play('bounce');

      // di chuyển ngẫu nhiên: thỉnh thoảng đổi hướng cong ngẫu nhiên, không lao vào nhau
      b.wanderT -= dt;
      if (b.wanderT <= 0) { b.wanderT = rand(0.4, 1.3); b.wanderW = rand(-2.4, 2.4); }
      { const cur = Math.atan2(b.vy, b.vx) + b.wanderW * dt, s0 = Math.hypot(b.vx, b.vy); b.vx = Math.cos(cur) * s0; b.vy = Math.sin(cur) * s0; }

      // đưa tốc độ về mức chuẩn sau va chạm / giật lùi
      let sp = Math.hypot(b.vx, b.vy) || 1;
      const boost = (b.type === 'bolt' && b.boltPhase === 'dash') ? DASH_MULT : 1;   // Gia Tốc Lôi
      const slow = (b.netT > 0 && boost === 1) ? NET_SLOW : 1;                       // dính lưới: bị làm chậm
      sp += (b.spd * boost * slow - sp) * (1 - Math.exp(-((boost > 1 || slow < 1) ? 8 : 1.6) * dt));
      let dx = b.vx, dy = b.vy; const m = Math.hypot(dx, dy) || 1; dx /= m; dy /= m;
      {                                                  // tránh nảy thẳng đứng/ngang mãi
        if (Math.abs(dx) < 0.25) dx = (dx >= 0 ? 1 : -1) * 0.25;
        if (Math.abs(dy) < 0.25) dy = (dy >= 0 ? 1 : -1) * 0.25;
      }
      const n = Math.hypot(dx, dy); b.vx = dx / n * sp; b.vy = dy / n * sp;
    }

    // va chạm thân bóng: mọi cặp đều nảy; chỉ khác đội mới bị trừ máu
    for (let i = 0; i < balls.length; i++) for (let j = i + 1; j < balls.length; j++) {
      const p = balls[i], q = balls[j];
      if (!p.alive || !q.alive) continue;
      const dx = q.x - p.x, dy = q.y - p.y, d = Math.hypot(dx, dy), min = p.r + q.r;
      if (d < min && d > 0) {
        const nx = dx / d, ny = dy / d, pen = min - d;
        p.x -= nx * pen / 2; p.y -= ny * pen / 2; q.x += nx * pen / 2; q.y += ny * pen / 2;
        const rv = (q.vx - p.vx) * nx + (q.vy - p.vy) * ny;
        if (rv < 0) { p.vx += nx * rv; p.vy += ny * rv; q.vx -= nx * rv; q.vy -= ny * rv; if (rv < -60) Snd.play('ballhit'); }
        if (p.side !== q.side && p.contactCd <= 0 && q.contactCd <= 0) {
          p.contactCd = q.contactCd = 0.5;
          const mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2;
          hurt(p, 1, mx, my, 'ballhit'); hurt(q, 1, mx, my, 'ballhit');
          if (p.type === 'bolt' && p.stuckT <= 0) applyShock(q);   // nội tại bóng sét: chạm bóng khác là giật điện (bị khóa thì mất)
          if (q.type === 'bolt' && q.stuckT <= 0) applyShock(p);
          if (p.type === 'mystery' && p.stuckT <= 0) mysteryRoll(p, q);   // nội tại bóng "?" (bị khóa thì mất)
          if (q.type === 'mystery' && q.stuckT <= 0) mysteryRoll(q, p);
        }
      }
    }

    // vũ khí (đổi thứ tự ngẫu nhiên mỗi bước để không bên nào được ưu tiên)
    for (const b of shuffled(balls)) {
      if (!b.alive) continue;
      const e = foe(b);
      tickShock(b, dt);
      if (b.stuckT > 0) { disarm(b); continue; }          // dính bẫy: không dùng được vũ khí lẫn chiêu
      if (b.type !== 'scythe' && b.type !== 'bolt' && b.type !== 'trapper' && b.type !== 'soldier' && b.type !== 'mystery' && b.type !== 'fire' && b.type !== 'ice') { if (!skillOn(b)) b.abT += dt; if (b.abT >= CD[b.type]) { b.abT = 0; castAbility(b, e); } }
      if (b.type === 'ice') updateBlade(b, e, dt);        // kiếm băng chạy song song với chiêu (updateIce bên dưới)
      if (b.type === 'sword' || b.type === 'scythe') updateBlade(b, e, dt);
      else if (b.type === 'saw') updateSaw(b, e, dt);
      else if (b.type === 'shield') updateShield(b, e, dt);
      else if (b.type === 'fan') updateFan(b, e, dt);
      else if (b.type === 'bolt') updateBolt(b, e, dt);
      else if (b.type === 'trapper') updateTrapper(b, e, dt);
      else if (b.type === 'soldier') updateSoldier(b, e, dt);
      else if (b.type === 'mystery') { /* không có vũ khí, không có chiêu */ }
      else if (b.type === 'fire') updateFire(b, e, dt);
      else if (b.type === 'ice') updateIce(b, e, dt);
      else updateGun(b, e, dt);
    }

    // lưỡi chạm lưỡi (chỉ giữa hai đội khác nhau)
    if (clashCd <= 0) {
      let hit = null, ca = null, cb = null;
      for (let i = 0; i < balls.length && !hit; i++) for (let j = i + 1; j < balls.length && !hit; j++) {
        const a1 = balls[i], a2 = balls[j];
        if (!a1.alive || !a2.alive || a1.side === a2.side) continue;
        const s1 = weaponSegs(a1), s2 = weaponSegs(a2);
        for (const u of s1) { for (const v of s2) { hit = segInter(u[0], u[1], u[2], u[3], v[0], v[1], v[2], v[3]); if (hit) { ca = a1; cb = a2; break; } } if (hit) break; }
      }
      if (hit) {
        clashCd = 0.3;
        ca.sdir *= -1; cb.sdir *= -1;
        burst(hit.x, hit.y, 24, '#fff2b0', 320, 0.4);
        shake = Math.min(shake + 4, 9);
        Snd.play('clash');
      }
    }

    updateBullets(dt);
    updateWaves(dt);
    updateFireballs(dt); updateCrystals(dt); updateFrost(dt);
    updateRings(dt);
    updateThunders(dt);
    updateTraps(dt);
    updateNets(dt);
    updateMines(dt);
    updateTornados(dt);
    if (cfg.map === 'war' && state === 'play') updateWar(dt);   // hộp cứu thương, bộ đàm, tiêm kích
  }

  // hiệu ứng
  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i]; q.life -= dt;
    if (q.life <= 0) { parts.splice(i, 1); continue; }
    q.x += q.vx * dt; q.y += q.vy * dt;
    const drag = Math.pow(0.04, dt); q.vx *= drag; q.vy *= drag;
  }
  for (let i = blasts.length - 1; i >= 0; i--) {
    const q = blasts[i]; q.t += dt;
    const dur = q.dur || 0.4;
    if (q.t >= dur) { blasts.splice(i, 1); continue; }
    if (q.follow) { q.x = q.follow.x; q.y = q.follow.y; }
    q.p = q.t / dur; q.r = q.r0 + (q.max - q.r0) * (1 - Math.pow(1 - q.p, 2));
  }
  for (let i = scorches.length - 1; i >= 0; i--) {       // vết cháy: lan ra nhanh, than hồng âm ỉ vài giây rồi nguội dần
    const z = scorches[i]; z.t += dt;
    if (z.t < 2.4 && Math.random() < dt * 22) {
      const a = rand(0, Math.PI * 2), d = z.max * rand(0.3, 1);
      parts.push({ x: z.x + Math.cos(a) * d, y: z.y + Math.sin(a) * d, vx: rand(-20, 20), vy: rand(-90, -30), life: 0.5, max: 0.5, col: Math.random() < 0.5 ? '#ff8a3a' : '#ffd27a', size: rand(1.2, 2.4) });
    }
    if (z.t > 11) scorches.splice(i, 1);
  }
  for (let i = texts.length - 1; i >= 0; i--) {
    const t = texts[i]; t.life -= dt;
    if (t.life <= 0) { texts.splice(i, 1); continue; }
    t.y += t.vy * dt; t.vy *= Math.pow(0.15, dt);
  }
  shake *= Math.exp(-9 * dt);
}

/* ---- kiếm & lưỡi hái ---- */
function castBlood(b) {                                  // Huyết Xung Kích: vùng máu lan tỏa ra từ chính bóng lưỡi hái
  floatText(clamp(b.x, 190, 490), b.y - b.r - 26, T('f_blood'), '#ff4d6d');
  rings.push({ x: b.x, y: b.y, R: b.r, owner: b, t: 0, done: new Set(), ph1: rand(0, 6.28), ph2: rand(0, 6.28), ph3: rand(0, 6.28), dmg: zoneDmg(b) });
  burst(b.x, b.y, 44, '#c80012', 430, 0.8);
  burst(b.x, b.y, 18, '#ff6a6a', 300, 0.5);
  shake = Math.min(shake + 6, 11);
  Snd.play('blood');
}
function updateBlade(b, _e, dt) {
  const isSword = b.type === 'sword' || b.type === 'ice';
  b.sa += b.sdir * (isSword ? 5 : 4.4) * dt;
  if (!isSword) b.slashCd = Math.max(0, b.slashCd - dt);
  if (!isSword && b.ringDelay > 0) {                     // đếm ngược ngầm (không có hoạt ảnh)
    b.ringDelay -= dt;
    if (b.ringDelay <= 0 && state === 'play') castBlood(b);
  }
  if (b.swordCd > 0) return;
  let best = null, e = null;                             // chọn đối thủ đang bị lưỡi chạm sâu nhất
  for (const en of liveFoes(b)) {
    for (const sg of weaponSegs(b)) {
      const r = segDist(en.x, en.y, sg[0], sg[1], sg[2], sg[3]);
      if (r.d < en.r && (!best || r.d - en.r < best.d - e.r)) { best = r; e = en; }
    }
  }
  if (!best) return;

  let nx = e.x - b.x, ny = e.y - b.y; const m = Math.hypot(nx, ny) || 1; nx /= m; ny /= m;
  if (shieldHolds(e, best.cx, best.cy)) {                // bị khiên đỡ
    drainGuard(e, 65);
    b.swordCd = 0.5;
    knock(b, -nx, -ny, 170);
    burst(best.cx, best.cy, 14, '#cfe0ff', 240, 0.3);
    Snd.play('block');
    return;
  }
  const dmg = b.type === 'ice' ? mdmg(swordDmg(b) * ICE_SWORD_MUL) : isSword ? swordDmg(b) : scytheDmg(b);
  b.swordCd = isSword ? 0.35 : 0.4;
  b.hits++;
  hurt(e, dmg, best.cx, best.cy, isSword ? 'slash' : 'scythe');
  knock(e, nx, ny, isSword ? 260 : 300);
  knock(b, -nx, -ny, 80);
  if (!isSword) {
    heal(b, SCYTHE_HEAL);                                 // mỗi nhát chém hút 6 máu
    if (b.ringDelay <= 0 && b.slashCd <= 0) {            // mỗi nhát chém chỉ tính 1 lần, hai nhát tính cách nhau ít nhất 0,9 giây
      b.slashCd = SCYTHE_GAP;
      b.sHits++;
      if (b.sHits >= SCYTHE_HITS && state === 'play') {  // đủ 2 nhát chém: bắt đầu đếm ngược 2 giây rồi mới tung chiêu
        b.sHits = 0;
        b.ringDelay = SCYTHE_DELAY;
      }
    }
  }
}

/* ---- cưa ---- */
function updateSaw(b, _e, dt) {
  b.bigT = Math.max(0, b.bigT - dt);
  b.sa += b.sdir * 4.2 * dt;
  b.spin += 28 * dt;
  b.tickCd = Math.max(0, b.tickCd - dt);
  if (b.tickCd > 0) return;
  const [sx, sy] = sawPos(b);
  let e = null, d = 0;
  for (const en of liveFoes(b)) {
    const dd = Math.hypot(en.x - sx, en.y - sy);
    if (dd < sawR(b) + en.r && (!e || dd - en.r < d - e.r)) { e = en; d = dd; }
  }
  if (!e) return;
  const nx = (e.x - sx) / (d || 1), ny = (e.y - sy) / (d || 1);
  const px = sx + nx * sawR(b), py = sy + ny * sawR(b);
  if (shieldHolds(e, px, py)) {
    drainGuard(e, 35);
    hurt(e, Math.max(1, Math.round(sawDmg(b) * 0.4)), px, py, 'saw');   // cưa cắt xuyên một phần khiên
    b.tickCd = 0.2;
    knock(b, -nx, -ny, 70);
    burst(px, py, 8, '#cfe0ff', 220, 0.25);
    Snd.play('block');
    return;
  }
  b.tickCd = 0.08; b.hits++;
  hurt(e, sawDmg(b), px, py, 'saw');
  e.vx *= 0.88; e.vy *= 0.88;                         // đĩa cưa kẹt lại, làm đối thủ chậm đi
}

/* ---- khiên ---- */
/* ---- quạt ---- */
function fanPos(b) { const d = b.r + 34; return [b.x + Math.cos(b.sa) * d, b.y + Math.sin(b.sa) * d]; }
function updateFan(b, _e, dt) {
  b.sa += b.sdir * 4.2 * dt;
  if (b.swordCd > 0) return;
  const [fx, fy] = fanPos(b);
  let e = null, d = 0;
  for (const en of liveFoes(b)) {
    const dd = Math.hypot(en.x - fx, en.y - fy);
    if (dd < FAN_R + en.r && (!e || dd - en.r < d - e.r)) { e = en; d = dd; }
  }
  if (!e) return;
  let nx = e.x - b.x, ny = e.y - b.y; const m = Math.hypot(nx, ny) || 1; nx /= m; ny /= m;
  const px = fx + (e.x - fx) / (d || 1) * FAN_R, py = fy + (e.y - fy) / (d || 1) * FAN_R;
  if (shieldHolds(e, px, py)) {
    drainGuard(e, 65);
    b.swordCd = 0.5;
    knock(b, -nx, -ny, 150);
    burst(px, py, 10, '#cfe0ff', 220, 0.3);
    Snd.play('block');
    return;
  }
  b.swordCd = 0.45; b.hits++;
  hurt(e, fanDmg(b), px, py, 'gust');
  knock(e, nx, ny, 430);                                 // gió hất văng
  knock(b, -nx, -ny, 60);
  burst(px, py, 12, '#d8fff0', 260, 0.35);
}
function spawnTornado(b, e) {
  const [fx, fy] = fanPos(b);
  const a = Math.atan2(e.y - fy, e.x - fx);
  tornados.push({ x: fx, y: fy, vx: Math.cos(a) * 230, vy: Math.sin(a) * 230, owner: b, life: TORN_LIFE, tick: 0, spin: 0, tk: new Map() });
  burst(fx, fy, 14, '#e6f6ff', 240, 0.4);
  Snd.play('wind');
}
function updateTornados(dt) {
  for (let i = tornados.length - 1; i >= 0; i--) {
    const t = tornados[i];
    t.life -= dt; t.spin += dt * 9;
    // lốc xoáy không bám theo đối thủ: bay thẳng theo hướng lúc phóng, chạm tường thì nảy lại
    for (const e of liveFoes(t.owner)) {                 // hút + xoáy mọi đối thủ trong tầm
      const dx = t.x - e.x, dy = t.y - e.y, d = Math.hypot(dx, dy) || 1;
      if (d < TORN_PULL) {
        const k = 1 - d / TORN_PULL;
        e.vx += (dx / d) * 2600 * k * dt + (-dy / d) * 1000 * k * dt;
        e.vy += (dy / d) * 2600 * k * dt + (dx / d) * 1000 * k * dt;
        const sp = Math.hypot(e.vx, e.vy);
        if (sp > 650) { e.vx *= 650 / sp; e.vy *= 650 / sp; }
      }
      const tk = (t.tk.get(e) || 0) - dt;
      if (d < TORN_R + e.r * 0.5 && tk <= 0) {
        t.tk.set(e, 0.3);
        if (shieldHolds(e, t.x, t.y)) { drainGuard(e, 20); Snd.play('block'); }
        else { hurt(e, tornDmg(t.owner), e.x, e.y, 'gust'); t.owner.hits++; }
      } else t.tk.set(e, Math.max(0, tk));
    }
    t.x += t.vx * dt; t.y += t.vy * dt;
    if (t.x < A.x0 || t.x > A.x1) { t.vx *= -1; t.x = clamp(t.x, A.x0, A.x1); }
    if (t.y < A.y0 || t.y > A.y1) { t.vy *= -1; t.y = clamp(t.y, A.y0, A.y1); }
    if (Math.random() < 0.6) burst(t.x + rand(-26, 26), t.y + rand(-34, 30), 1, '#e6f6ff', 90, 0.4);
    if (t.life <= 0) tornados.splice(i, 1);
  }
}

function updateShield(b, e, dt) {
  b.bashCd = Math.max(0, b.bashCd - dt);
  b.aura = Math.max(0, b.aura - dt);
  if (b.breakT > 0) { b.breakT -= dt; if (b.breakT <= 0) b.guard = 100; }
  else b.guard = Math.min(100, b.guard + 1.8 * dt);
  if (!e.alive) return;
  const tgt = Math.atan2(e.y - b.y, e.x - b.x);
  b.sh += clamp(angDiff(tgt, b.sh), -4 * dt, 4 * dt);
  if (b.breakT > 0 || b.bashCd > 0) return;
  const nx = Math.cos(b.sh), ny = Math.sin(b.sh);
  const bx = b.x + nx * (b.r + 26), by = b.y + ny * (b.r + 26);
  const v = liveFoes(b).find(en => Math.hypot(en.x - bx, en.y - by) < en.r + 10);
  if (!v) return;
  b.bashCd = 1.3;
  if (shieldHolds(v, bx, by)) {
    drainGuard(v, 40);
    hurt(v, Math.round(bashDmg(b) * 0.6), bx, by, 'bash');   // khiên húc khiên vẫn gây chút sát thương
    knock(b, -nx, -ny, 200);
    burst(bx, by, 14, '#cfe0ff', 240, 0.3);
    Snd.play('block');
    return;
  }
  b.hits++;
  hurt(v, bashDmg(b), bx, by, 'bash');
  knock(v, nx, ny, 380);
  knock(b, -nx, -ny, 120);
}

/* ---- bóng sét ---- */
function applyShock(t) {                                 // giật điện: kéo dài 3,5 giây, chạm lại chỉ làm mới thời gian
  if (!t.alive || state !== 'play' || (t.type === 'bolt' && t.boltPhase === 'dash')) return;   // đang là chùm năng lượng: miễn nhiễm
  const fresh = t.shockT <= 0;
  t.shockT = SHOCK_T;
  if (fresh) {
    t.shockTick = 0;
    floatText(t.x, t.y - t.r - 24, T('f_shock'), '#ffe45a');
    burst(t.x, t.y, 14, '#bfe9ff', 280, 0.3);
    Snd.play('zap');
  }
}
function tickShock(b, dt) {
  if (b.shockT <= 0) return;
  b.shockT -= dt; b.shockTick -= dt;
  if (b.shockTick <= 0) { b.shockTick += SHOCK_GAP; hurt(b, SHOCK_DMG, b.x, b.y, 'zap'); }
  if (Math.random() < 0.4) burst(b.x + rand(-b.r, b.r), b.y + rand(-b.r, b.r), 1, '#cfeeff', 120, 0.25);
}
function updateBolt(b, e, dt) {
  for (const q of b.trail) q.t += dt;
  while (b.trail.length && b.trail[0].t > 0.45) b.trail.shift();
  if (b.boltPhase === 'dash') b.trail.push({ x: b.x, y: b.y, t: 0 });
  b.boltT -= dt;
  if (b.boltT > 0) return;
  if (b.boltPhase === 'cool') {
    if (!e.alive) { b.boltT = 0.3; return; }
    if (Math.random() < P_THUNDER) {                     // Lôi Kích: phóng điện lan tỏa
      b.boltPhase = 'thunder'; b.boltT = THUNDER_LIFE;
      const ang = Math.atan2(e.y - b.y, e.x - b.x), dist = Math.hypot(e.x - b.x, e.y - b.y);
      thunders.push({ x: b.x, y: b.y, ang, len: dist + 70, owner: b, t: 0, hit: false, seed: Math.floor(rand(1, 99999)) });
      floatText(clamp(b.x, 160, 520), b.y - b.r - 26, T('f_thunder'), '#fff27a');
      burst(b.x, b.y, 30, '#fff3a0', 380, 0.5);
      shake = Math.min(shake + 6, 11);
      Snd.play('thunder');
    } else {                                             // Gia Tốc Lôi: tăng tốc 2,4 giây, đụng trúng vẫn tiếp tục
      b.boltPhase = 'dash'; b.boltT = DASH_T; b.trail = [];
      floatText(clamp(b.x, 160, 520), b.y - b.r - 26, T('f_dash'), '#9fe8ff');
      Snd.play('dash');
    }
  } else { b.boltPhase = 'cool'; b.boltT = BOLT_CD; }    // hết chiêu: hồi 3 giây rồi mới có chiêu tiếp
}
function updateThunders(dt) {                            // tia điện đánh trúng mọi đối thủ nằm trên đường tia
  for (let i = thunders.length - 1; i >= 0; i--) {
    const z = thunders[i];
    z.t += dt;
    if (z.owner.alive) { z.x = z.owner.x; z.y = z.owner.y; }
    if (!z.hit && z.t >= 0.06) {
      z.hit = true;
      const x2 = z.x + Math.cos(z.ang) * z.len, y2 = z.y + Math.sin(z.ang) * z.len;
      for (const e of liveFoes(z.owner)) {
        if (segDist(e.x, e.y, z.x, z.y, x2, y2).d > e.r + 14) continue;
        if (shieldHolds(e, z.x, z.y)) { drainGuard(e, 40); Snd.play('block'); continue; }
        hurt(e, THUNDER_DMG, e.x, e.y, 'zap');
        knock(e, Math.cos(z.ang), Math.sin(z.ang), 200);
        burst(e.x, e.y, 16, '#9fd4ff', 320, 0.4);
      }
    }
    if (z.t >= THUNDER_LIFE) thunders.splice(i, 1);
  }
}

/* ---- Trapper & Soldier ---- */
const pickRand = arr => arr[Math.floor(Math.random() * arr.length)];
const inArena = (x, y, m) => [clamp(x, A.x0 + m, A.x1 - m), clamp(y, A.y0 + m, A.y1 - m)];
const isBeamForm = t => t.type === 'bolt' && t.boltPhase === 'dash';          // chùm năng lượng: miễn nhiễm mọi hiệu ứng

function updateTrapper(b, e, dt) {                       // nội tại: liên tục đặt bẫy gấu mỗi TRAP_EVERY giây; chiêu chủ động: Lưới Điện
  if (e.alive && state === 'play') {
    b.skAux -= dt;
    if (b.skAux <= 0) { b.skAux += TRAP_EVERY; placeTrap(b); }          // đều đặn, không ngẫu nhiên
  }
  b.skT -= dt;
  if (b.skPhase === 'cool') {
    if (b.skT <= 0 && e.alive) { b.skPhase = 'net'; b.skT = 0.7; throwNet(b, e); }
  } else if (b.skT <= 0) { b.skPhase = 'cool'; b.skT = NET_CD; }
}
function placeTrap(b) {                                  // bẫy sinh ra ngay chỗ bóng Trapper; Trapper di chuyển nên bẫy rải dọc đường đi
  const mine = traps.filter(t => t.owner === b && !t.holder && t.fade === undefined);
  if (mine.length >= TRAP_MAX) mine[0].fade = 0.4;       // quá giới hạn: bẫy cũ nhất tự tan
  let x = b.x, y = b.y;
  if (traps.some(t => t.fade === undefined && Math.hypot(t.x - x, t.y - y) < 30)) {   // đứng yên một chỗ: lệch nhẹ để bẫy không chồng khít nhau
    const a = rand(0, Math.PI * 2), d = rand(30, 46);
    [x, y] = inArena(b.x + Math.cos(a) * d, b.y + Math.sin(a) * d, 40);
  }
  traps.push({ x, y, owner: b, t: 0, life: TRAP_LIFE, holder: null, snapT: 0 });
  burst(x, y, 8, '#c9b27a', 160, 0.3);
  Snd.play('trapset');
}
function throwNet(b, e) {                                // quăng lưới vào đối thủ: lưới xoay vòng khi bay
  const a = Math.atan2(e.y - b.y, e.x - b.x);
  nets.push({ x: b.x + Math.cos(a) * (b.r + 10), y: b.y + Math.sin(a) * (b.r + 10), vx: Math.cos(a) * 470, vy: Math.sin(a) * 470, owner: b, rot: 0, t: 0, target: null });
  Snd.play('net'); Snd.play('zap');
}
function updateTraps(dt) {
  for (let i = traps.length - 1; i >= 0; i--) {
    const tr = traps[i]; tr.t += dt;
    if (tr.fade !== undefined) { tr.fade -= dt; if (tr.fade <= 0) traps.splice(i, 1); continue; }
    if (tr.holder) {                                     // đã sập: giữ đối thủ tại chỗ tới khi hết dính
      tr.snapT += dt;
      if (tr.holder.alive && tr.holder.stuckT > 0) { tr.holder.x = tr.x; tr.holder.y = tr.y; }
      else { tr.holder = null; tr.fade = 0.4; }
      continue;
    }
    if (tr.t > tr.life - 0.4) { tr.fade = 0.4; continue; }   // hết 5,3 giây: mờ dần 0,4 giây rồi biến mất
    for (const e of liveFoes(tr.owner)) {
      if (e.stuckT > 0 || e.trapImm > 0 || isBeamForm(e)) continue;
      if (Math.hypot(e.x - tr.x, e.y - tr.y) < TRAP_R + e.r * 0.5) {
        tr.holder = e; tr.snapT = 0;
        e.stuckT = TRAP_STICK; e.x = tr.x; e.y = tr.y; e.vx = e.vy = 0;
        hurt(e, TRAP_DMG, tr.x, tr.y, 'trap');
        burst(tr.x, tr.y, 14, '#d8d2c0', 260, 0.35);
        shake = Math.min(shake + 3, 9);
        break;
      }
    }
  }
}
function updateNets(dt) {
  for (let i = nets.length - 1; i >= 0; i--) {
    const n = nets[i]; n.t += dt; n.rot += dt * (n.target ? 5 : 9);
    if (n.target) {                                      // đã quấn vào đối thủ: bám theo tới khi hết bị chậm
      const e = n.target;
      if (!e.alive || e.netT <= 0) { nets.splice(i, 1); continue; }
      n.x = e.x; n.y = e.y; continue;
    }
    n.x += n.vx * dt; n.y += n.vy * dt;
    if (n.t > 1.8 || n.x < A.x0 - 20 || n.x > A.x1 + 20 || n.y < A.y0 - 20 || n.y > A.y1 + 20) { nets.splice(i, 1); continue; }
    for (const e of liveFoes(n.owner)) {
      if (Math.hypot(e.x - n.x, e.y - n.y) >= e.r + 34) continue;
      if (shieldHolds(e, n.x, n.y)) { drainGuard(e, 25); burst(n.x, n.y, 10, '#cfe0ff', 240, 0.3); Snd.play('block'); nets.splice(i, 1); }
      else if (isBeamForm(e)) nets.splice(i, 1);
      else {
        e.netT = NET_T; e.netTick = 0.25; n.target = e; n.vx = n.vy = 0;
        burst(e.x, e.y, 18, '#bfe9ff', 320, 0.4);
        shake = Math.min(shake + 3, 9);
        Snd.play('nethit'); Snd.play('zap');
      }
      break;
    }
  }
}

function updateSoldier(b, e, dt) {                       // kỹ năng xuất hiện ngẫu nhiên: AK, bazooka hoặc đặt mìn
  b.skT -= dt;
  if (b.skPhase === 'cool') {
    if (b.skT <= 0 && e.alive) {
      const k = pickRand(['ak', 'bazooka', 'mine']);
      b.skPhase = k;
      if (k === 'ak') { b.skT = AK_T; b.akCd = 0.2; }
      else if (k === 'bazooka') { b.skT = BAZ_T; b.rocket = false; }
      else { b.skT = 0.8; placeMines(b, e); }
    }
    return;
  }
  if (b.skPhase === 'ak' || b.skPhase === 'bazooka') {
    let aligned = false;
    if (e.alive) {
      const tgt = Math.atan2(e.y - b.y, e.x - b.x);
      b.ga += clamp(angDiff(tgt, b.ga), -9 * dt, 9 * dt);
      aligned = Math.abs(angDiff(tgt, b.ga)) < 0.15;
    }
    if (b.skPhase === 'ak') {
      b.akCd -= dt;
      if (b.akCd <= 0 && aligned) { b.akCd = AK_GAP; fireAK(b); }                     // bắn liên thanh
    } else if (!b.rocket && b.skT < BAZ_T - 0.45 && e.alive && (aligned || b.skT < 0.3)) { b.rocket = true; fireBazooka(b); }
  }
  if (b.skT <= 0) { b.skPhase = 'cool'; b.skT = SK_CD; }                              // cất súng
}
function fireAK(b) {
  const a = b.ga + rand(-0.05, 0.05), c = Math.cos(a), sn = Math.sin(a), reach = b.r * 0.5 + 76;
  bullets.push({ x: b.x + c * reach, y: b.y + sn * reach, vx: c * 640, vy: sn * 640, owner: b, dmg: AK_DMG, life: 2 });
  b.muzzle = 0.05;
  knock(b, -c, -sn, 12);
  Snd.play('ak');
}
function fireBazooka(b) {
  const c = Math.cos(b.ga), sn = Math.sin(b.ga), reach = b.r * 0.5 + 80;
  bullets.push({ x: b.x + c * reach, y: b.y + sn * reach, vx: c * 480, vy: sn * 480, owner: b, dmg: BAZ_DMG, rad: BAZ_R, boom: true, nohome: true, life: 3 });
  b.muzzle = 0.14;
  knock(b, -c, -sn, 170);
  burst(b.x + c * reach, b.y + sn * reach, 14, '#ffb060', 300, 0.35);
  shake = Math.min(shake + 3, 9);
  Snd.play('bazooka');
}
function placeMines(b, e) {                              // đặt mìn xung quanh sân (2 quả gần đối thủ, còn lại rải ngẫu nhiên)
  for (let k = 0; k < MINE_N; k++) {
    let x, y, tries = 0;
    do {
      if (k < 2 && e.alive) { const a = rand(0, Math.PI * 2), d = rand(30, 150); [x, y] = inArena(e.x + Math.cos(a) * d, e.y + Math.sin(a) * d, 40); }
      else { x = rand(A.x0 + 50, A.x1 - 50); y = rand(A.y0 + 50, A.y1 - 50); }
      tries++;
    } while (tries < 14 && mines.some(m => Math.hypot(m.x - x, m.y - y) < 90));
    mines.push({ x, y, owner: b, t: 0, last: -1 });
  }
  Snd.play('minesset');
}
function updateMines(dt) {
  for (let i = mines.length - 1; i >= 0; i--) {
    const m = mines[i]; m.t += dt;
    const rate = m.t < 2 ? 1 : m.t < 3 ? 3 : m.t < 3.6 ? 6 : 10;   // bíp thưa → dày dần → dồn dập sát lúc nổ
    if (!(m.t < m.nt)) { Snd.play('mbeep', m.t / MINE_FUSE); m.nt = m.t + 1 / rate; }
    if (m.t >= MINE_FUSE) { explode(m.x, m.y, m.owner, MINE_DMG, MINE_R, 'mine'); mines.splice(i, 1); }   // hết 4 giây: kích hoạt và nổ
  }
}

/* ---- súng ---- */
function leadAim(b, e, speed) {
  const t = Math.hypot(e.x - b.x, e.y - b.y) / speed;
  return Math.atan2(e.y + e.vy * t - b.y, e.x + e.vx * t - b.x);   // ngắm đón đầu
}
function updateGun(b, e, dt) {
  if (!e.alive) return;
  const tgt = Math.atan2(e.y - b.y, e.x - b.x);
  b.ga += clamp(angDiff(tgt, b.ga), -9 * dt, 9 * dt);
  b.gcd -= dt;
  if (b.gcd <= 0 && Math.abs(angDiff(tgt, b.ga)) < 0.12) {
    const c = Math.cos(b.ga), s = Math.sin(b.ga), reach = b.r * 0.55 + 52;
    bullets.push({ x: b.x + c * reach, y: b.y + s * reach, vx: c * BULLET_SPEED, vy: s * BULLET_SPEED, owner: b, dmg: gunDmg(b), life: 3 });
    b.gcd = b.fireInt;
    b.muzzle = 0.08;
    knock(b, -c, -s, 70);
    burst(b.x + c * reach, b.y + s * reach, 5, '#ffe28a', 160, 0.2);
    Snd.play('shot');
  }
  // loạt 3 đạn nổ (mỗi 3 giây)
  if (b.volley > 0) {
    b.volleyT -= dt;
    if (b.volleyT <= 0) { b.volleyT = 0.14; b.volley--; fireBoom(b, e); }
  }
}
function fireBoom(b, e) {
  const a = leadAim(b, e, BOOM_SPEED);
  b.ga = a;
  const c = Math.cos(a), s = Math.sin(a), reach = b.r * 0.55 + 52;
  bullets.push({ x: b.x + c * reach, y: b.y + s * reach, vx: c * BOOM_SPEED, vy: s * BOOM_SPEED, owner: b, dmg: boomDmg(b), life: 3, boom: true });
  b.muzzle = 0.1;
  knock(b, -c, -s, 50);
  burst(b.x + c * reach, b.y + s * reach, 8, '#ff9a3c', 220, 0.25);
  Snd.play('rocket');
}
function explode(x, y, owner, dmg, rad, fx) {
  const blastSnd = fx === 'mine' ? 'mineboom' : fx === 'baz' ? 'bazboom' : null;
  if (blastSnd) Snd.play(blastSnd);                      // luôn nghe tiếng nổ, kể cả khi trúng khiên / hụt
  if (fx === 'mine') {                                   // mìn: nổ bùng — quả cầu lửa, sóng xung kích, khói, mảnh văng và vết cháy lan trên nền
    blasts.push({ x, y, r0: 10, r: 10, max: rad * 1.12, t: 0, p: 0, dur: 0.95, col: 'mine', seed: Math.floor(rand(1, 99999)) });
    scorches.push({ x, y, max: rad * 0.95, t: 0, seed: Math.floor(rand(1, 99999)) });
    if (scorches.length > 22) scorches.shift();
    burst(x, y, 46, '#ffb340', 560, 0.7);
    burst(x, y, 24, '#ff5a1a', 420, 0.8);
    burst(x, y, 16, '#ffffff', 360, 0.35);
    burst(x, y, 20, '#2b2523', 200, 1.3);               // khói đen
    shake = Math.min(shake + 10, 14);
  } else {
    blasts.push({ x, y, r0: 8, r: 8, max: rad, t: 0, p: 0, col: 'fire' });
    burst(x, y, 28, '#ffb340', 400, 0.5);
    burst(x, y, 12, '#ffffff', 300, 0.3);
    shake = Math.min(shake + 6, 11);
  }
  let any = false;
  for (const e of liveFoes(owner)) {                     // vụ nổ ảnh hưởng mọi đối thủ trong bán kính
    const d = Math.hypot(e.x - x, e.y - y);
    if (d >= rad + e.r) continue;
    any = true;
    if (shieldHolds(e, x, y)) { drainGuard(e, 30); Snd.play('block'); continue; }
    hurt(e, dmg, x, y, blastSnd ? 'hit' : 'boom');       // trong vùng nổ là nhận đủ sát thương của viên đạn
    knock(e, (e.x - x) / (d || 1), (e.y - y) / (d || 1), 300);
    owner.hits++;
  }
  if (!any && !blastSnd) Snd.play('boom');
}

function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const bl = bullets[i];
    if (bl.boom && !bl.nohome) {                         // đạn nổ tự dò hướng nhẹ -> rất chính xác
      const en = foeAt(bl.owner, bl.x, bl.y);
      if (en.alive) {
        const cur = Math.atan2(bl.vy, bl.vx), want = Math.atan2(en.y - bl.y, en.x - bl.x);
        const nw = cur + clamp(angDiff(want, cur), -2.4 * dt, 2.4 * dt);
        bl.vx = Math.cos(nw) * BOOM_SPEED; bl.vy = Math.sin(nw) * BOOM_SPEED;
      }
    }
    bl.x += bl.vx * dt; bl.y += bl.vy * dt; bl.life -= dt;
    let dead = false;
    const end = (x, y) => { dead = true; if (bl.boom) explode(x, y, bl.owner, bl.dmg, bl.rad || BOOM_R, bl.nohome ? 'baz' : undefined); };

    if (bl.life <= 0) end(bl.x, bl.y);
    else if (bl.x < A.x0 || bl.x > A.x1 || bl.y < A.y0 || bl.y > A.y1) {
      const cx = clamp(bl.x, A.x0, A.x1), cy = clamp(bl.y, A.y0, A.y1);
      if (!bl.boom) burst(cx, cy, 6, '#ffe28a', 140, 0.25);
      end(cx, cy);
    }

    if (!dead) {
      for (const t of balls) {
        if (!t.alive || t.side === bl.owner.side) continue;     // không bắn trúng đồng đội
        const bw = bl.boom ? 12 : 8;
        if (t.type === 'sword' || t.type === 'ice' || t.type === 'scythe') {   // lưỡi kiếm / lưỡi hái đánh bay đạn
          for (const sg of weaponSegs(t)) {
            if (segDist(bl.x, bl.y, sg[0], sg[1], sg[2], sg[3]).d < bw) {
              burst(bl.x, bl.y, 10, '#fff2b0', 260, 0.3); Snd.play('ping'); end(bl.x, bl.y); break;
            }
          }
          if (dead) break;
        }
        if (t.type === 'fan' && t.stuckT <= 0) {           // gió thổi tan đạn
          const [fx, fy] = fanPos(t);
          if (Math.hypot(bl.x - fx, bl.y - fy) < FAN_R + 6) {
            burst(bl.x, bl.y, 10, '#d8fff0', 240, 0.3); Snd.play('gust'); end(bl.x, bl.y); break;
          }
        }
        if (t.type === 'saw' && t.stuckT <= 0) {           // đĩa cưa nghiền đạn
          const [sx, sy] = sawPos(t);
          if (Math.hypot(bl.x - sx, bl.y - sy) < sawR(t) + 5) {
            burst(bl.x, bl.y, 10, '#fff2b0', 260, 0.3); Snd.play('saw'); end(bl.x, bl.y); break;
          }
        }
        if (t.type === 'shield' && Math.hypot(bl.x - t.x, bl.y - t.y) < t.r + 38 && shieldHolds(t, bl.x, bl.y)) {
          if (bl.boom) end(bl.x, bl.y);                    // vụ nổ tự xử lý việc khiên đỡ
          else { drainGuard(t, 25); burst(bl.x, bl.y, 10, '#cfe0ff', 240, 0.3); Snd.play('block'); dead = true; }
          break;
        }
        if (Math.hypot(t.x - bl.x, t.y - bl.y) < t.r + (bl.boom ? 8 : 5)) {
          if (bl.boom) end(bl.x, bl.y);
          else {
            const m = Math.hypot(bl.vx, bl.vy);
            hurt(t, bl.dmg, bl.x, bl.y, 'hit');
            knock(t, bl.vx / m, bl.vy / m, 70);
            const o = bl.owner; o.hits++; o.fireInt = Math.max(0.28, o.fireInt * 0.96);
            dead = true;
          }
          break;
        }
      }
    }
    if (dead) bullets.splice(i, 1);
  }
}

/* ---- kiếm khí (chiêu của kiếm) ---- */
function slashWaves(b, e) {
  const base = Math.atan2(e.y - b.y, e.x - b.x);
  for (const off of [-0.3, 0, 0.3]) {
    const a = base + off;
    waves.push({ x: b.x + Math.cos(a) * (b.r + 30), y: b.y + Math.sin(a) * (b.r + 30), vx: Math.cos(a) * 430, vy: Math.sin(a) * 430, a, owner: b, dmg: waveDmg(b), life: 1.6 });
  }
  burst(b.x, b.y, 14, '#bfe8ff', 280, 0.3);
  Snd.play('wave');
}
function updateWaves(dt) {
  for (let i = waves.length - 1; i >= 0; i--) {
    const w = waves[i];
    w.x += w.vx * dt; w.y += w.vy * dt; w.life -= dt;
    let dead = w.life <= 0 || w.x < A.x0 - 20 || w.x > A.x1 + 20 || w.y < A.y0 - 20 || w.y > A.y1 + 20;
    if (!dead) {
      for (const e of liveFoes(w.owner)) {
        if (Math.hypot(e.x - w.x, e.y - w.y) < e.r + 16) {
          if (shieldHolds(e, w.x, w.y)) { drainGuard(e, 30); burst(w.x, w.y, 10, '#cfe0ff', 240, 0.3); Snd.play('block'); }
          else { hurt(e, w.dmg, w.x, w.y, 'slash'); knock(e, w.vx / 430, w.vy / 430, 150); w.owner.hits++; }
          dead = true; break;
        }
      }
    }
    if (dead) waves.splice(i, 1);
  }
}

/* ---- vùng Huyết Xung Kích (chiêu của lưỡi hái): vùng máu lan tỏa ra quanh bóng, trúng mỗi đối thủ một lần ---- */
function updateRings(dt) {
  for (let i = rings.length - 1; i >= 0; i--) {
    const z = rings[i];
    z.t += dt;
    if (z.owner.alive) { z.x = z.owner.x; z.y = z.owner.y; }              // vùng máu lan ra từ chính bóng
    const k = Math.min(1, z.t / ZONE_GROW);
    z.R = z.owner.r + (ZONE_R - z.owner.r) * (1 - Math.pow(1 - k, 3));     // lan nhanh rồi chậm dần
    for (const e of liveFoes(z.owner)) {
      if (z.done.has(e)) continue;
      const d = Math.hypot(e.x - z.x, e.y - z.y) || 1;
      if (d - e.r * 0.6 > z.R * 0.95) continue;                            // mép máu chưa lan tới
      z.done.add(e);
      if (shieldHolds(e, z.x, z.y)) { drainGuard(e, 40); Snd.play('block'); continue; }
      hurt(e, z.dmg, e.x, e.y, 'bleed');
      knock(e, (e.x - z.x) / d, (e.y - z.y) / d, 200);
      burst(e.x, e.y, 18, '#c80012', 300, 0.6);
    }
    if (z.t >= ZONE_LIFE) rings.splice(i, 1);
  }
}

/* ---- chiêu đặc biệt mỗi 3 giây ---- */
function castAbility(b, e) {
  if (b.type === 'sword') { if (e.alive) { slashWaves(b, e); floatText(b.x, b.y - b.r - 26, T('f_slash'), '#9fe8ff'); } }
  else if (b.type === 'saw') {                           // phình to một lúc rồi thu về
    b.bigT = SAW_BIG_T;
    const [sx, sy] = sawPos(b);
    floatText(b.x, b.y - b.r - 26, T('f_saw'), '#ffd23f');
    burst(sx, sy, 16, '#ffe9a8', 260, 0.4);
    Snd.play('grow');
  }
  else if (b.type === 'shield') {
    b.aura = AURA_T;
    blasts.push({ x: b.x, y: b.y, r0: b.r, r: b.r, max: b.r + 70, t: 0, p: 0, col: 'aura', follow: b });
    Snd.play('aura');
  }
  else if (b.type === 'gun') { b.volley = 3; b.volleyT = 0; }
  else if (b.type === 'fan') { if (e.alive) { spawnTornado(b, e); floatText(b.x, b.y - b.r - 26, T('f_wind'), '#ffd0dc'); } }
}

/* =====================================================================
   VẼ
   ===================================================================== */
function rr(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
}

/* =====================================================================
   MAP CHIẾN TRƯỜNG QUÂN SỰ
   ===================================================================== */
function warBuildCache() {                               // vẽ sẵn nền (rằn ri, bao cát, hố bom...) một lần, gấp đôi độ phân giải cho nét
  const S = 2, c = document.createElement('canvas'); c.width = W * S; c.height = H * S;
  const g = c.getContext('2d'); g.scale(S, S);
  const rng = mulberry(20261102), rnd = (a, b) => a + rng() * (b - a);
  const rrg = (x, y, w, h, r) => { g.beginPath(); if (g.roundRect) g.roundRect(x, y, w, h, r); else g.rect(x, y, w, h); };

function updateWar(dt) {

    supplyT = rand(SUPPLY_CHECK[0], SUPPLY_CHECK[1]);
    if (supplies.length === 0 && Math.random() < P_SUPPLY) spawnSupply();
  }
  radioT -= dt;
  if (radioT <= 0) {                                     // và có tỉ lệ sinh 2 bộ đàm
    radioT = rand(RADIO_CHECK[0], RADIO_CHECK[1]);
    if (radios.length === 0 && jets.length === 0 && Math.random() < P_RADIO) spawnRadios();
  }

    const s = supplies[i]; s.t += dt; if (s.drop > 0) s.drop -= dt;
    if (s.t > s.life) { supplies.splice(i, 1); continue; }
    if (s.drop > 0) continue;
    for (const b of balls) {
      if (!b.alive || b.hp >= b.maxhp - 0.5) continue;  // bóng đầy máu đi qua thì không lấy mất hộp
      if (Math.hypot(b.x - s.x, b.y - s.y) < b.r + 22) { healBall(b, s); supplies.splice(i, 1); break; }
    }
  }
  for (let i = radios.length - 1; i >= 0; i--) {
    const r = radios[i]; r.t += dt; if (r.drop > 0) r.drop -= dt;
    if (r.t > r.life) { radios.splice(i, 1); continue; }
    if (r.drop > 0) continue;

      if (!b.alive) continue;
      if (Math.hypot(b.x - r.x, b.y - r.y) < b.r + 20 && callJet(b, r)) { radios.splice(i, 1); break; }
    }

}

    if (j.life > 0) {                                    // bám sát: đổi hướng liên tục về phía đối thủ (giới hạn tốc độ bẻ lái)
      if (!j.target || !j.target.alive) j.target = foeAt(j.owner, j.x, j.y);
      if (j.target && j.target.alive) {
        const want = Math.atan2(j.target.y - j.y, j.target.x - j.x);

    j.trailT -= dt;
    if (j.trailT <= 0) {                                 // vệt khói trắng + tia lửa hậu
      j.trailT = 0.018;
      const tx = j.x - Math.cos(j.ang) * 36, ty = j.y - Math.sin(j.ang) * 36;
      parts.push({ x: tx, y: ty, vx: rand(-18, 18), vy: rand(-18, 18), life: 0.9, max: 0.9, col: '#e8eef5', size: rand(3, 5.5) });
      if (Math.random() < 0.4) parts.push({ x: tx, y: ty, vx: rand(-40, 40), vy: rand(-40, 40), life: 0.3, max: 0.3, col: '#ffb347', size: rand(1.5, 3) });
    }
    if (j.life > 0 && j.target && j.target.alive) {      // còi báo bị khóa mục tiêu: dồn dập hơn khi càng gần
      j.lockT -= dt;

function drawArmyHelmet(b) {                             // mũ quân đội: vỏ xanh rằn ri, viền, sao vàng
  const s = b.r / 32;

  ctx.strokeStyle = '#26301d'; ctx.lineWidth = 1.8; ctx.lineJoin = 'round';
  const g = ctx.createLinearGradient(0, -22, 0, 8); g.addColorStop(0, '#8aa066'); g.addColorStop(1, '#46583a');
  ctx.beginPath(); ctx.moveTo(-26, 6); ctx.bezierCurveTo(-27, -24, 27, -24, 26, 6); ctx.closePath();
  ctx.fillStyle = g; ctx.fill(); ctx.stroke();

  for (const [x, y, rx, ry, r] of [[-12, -8, 8, 4, 0.4], [8, -12, 9, 4, -0.3], [14, -2, 7, 3.5, 0.6], [-4, 0, 8, 3.5, -0.5]]) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, r, 0, Math.PI * 2); ctx.fill(); }
  ctx.restore();

  ctx.closePath(); ctx.fill();

}
function drawSoldierGun(b) {                             // AK hoặc bazooka đang cầm
  if (b.skPhase !== 'ak' && b.skPhase !== 'bazooka') return;
  ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.ga);
  if (Math.cos(b.ga) < 0) ctx.scale(1, -1);
  const x = b.r * 0.45;
  ctx.lineJoin = 'round'; ctx.strokeStyle = '#1b1f26'; ctx.lineWidth = 1.5;
  if (b.skPhase === 'ak') {
    ctx.fillStyle = '#7a4a22'; rr(x - 4, -5, 22, 10, 3); ctx.fill(); ctx.stroke();           // báng gỗ
    ctx.fillStyle = '#3a3f4a'; rr(x + 14, -7, 32, 12, 2); ctx.fill(); ctx.stroke();           // thân súng
    ctx.fillStyle = '#7a4a22'; rr(x + 42, -6, 20, 10, 3); ctx.fill(); ctx.stroke();           // ốp tay
    ctx.fillStyle = '#2c3038'; rr(x + 60, -3.5, 22, 5, 2); ctx.fill(); ctx.stroke();          // nòng
    ctx.fillStyle = '#2c3038'; ctx.beginPath(); ctx.moveTo(x + 28, 5); ctx.quadraticCurveTo(x + 34, 22, x + 44, 24); ctx.lineTo(x + 50, 18); ctx.quadraticCurveTo(x + 42, 14, x + 40, 5); ctx.closePath(); ctx.fill(); ctx.stroke(); // băng đạn cong
    ctx.fillStyle = '#2c3038'; rr(x + 20, 5, 7, 12, 2); ctx.fill(); ctx.stroke();             // báng cầm

    const g = ctx.createLinearGradient(0, -9, 0, 9); g.addColorStop(0, '#6d7f4d'); g.addColorStop(1, '#39462b');
    ctx.fillStyle = g; rr(x - 10, -8, 92, 16, 4); ctx.fill(); ctx.stroke();                   // ống bazooka
    ctx.fillStyle = '#2c3326'; rr(x + 70, -10, 16, 20, 3); ctx.fill(); ctx.stroke();          // miệng loe
    ctx.fillStyle = '#1b2016'; rr(x + 2, -10, 6, 20, 2); ctx.fill(); ctx.fillRect(x + 36, -9, 5, 18);
    ctx.fillStyle = '#2c3038'; rr(x + 28, 7, 8, 14, 2); ctx.fill(); ctx.stroke();             // tay cầm
  }
