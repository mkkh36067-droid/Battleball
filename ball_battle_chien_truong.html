function drawBehind(b) { if (b.type === 'sword') drawSword(b); else if (b.type === 'scythe') drawScythe(b); else if (b.type === 'saw') drawSaw(b); else if (b.type === 'fan') drawFan(b); else if (b.type === 'fire') drawFireBehind(b); else if (b.type === 'ice') { drawIceAura(b); drawIceSword(b); } }
function drawFront(b)  { if (b.type === 'gun') drawGun(b); else if (b.type === 'shield') { drawAura(b); drawShield(b); } else if (b.type === 'soldier') drawSoldierGun(b); else if (b.type === 'fire') drawFireFront(b); }

function drawCountdown() {
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  let txt = null, col = '#fff', size = 150, alpha = 1;
  if (state === 'ready') { txt = String(Math.max(1, Math.ceil(readyT))); alpha = 0.55 + 0.45 * (readyT % 1); }
  else if (goT > 0) { txt = "Let's Fight!"; col = '#ffd23f'; size = 92; alpha = Math.min(1, goT / 0.4); }
  if (txt) {
    ctx.globalAlpha = alpha;
    ctx.font = '900 ' + size + 'px "Avenir Next","Segoe UI",Arial,sans-serif';
    ctx.lineWidth = 14; ctx.strokeStyle = '#000'; ctx.strokeText(txt, W / 2, H / 2);
    ctx.fillStyle = col; ctx.fillText(txt, W / 2, H / 2);
  }
  ctx.restore();
}

function render() {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.save();
  if (shake > 0.2) ctx.translate(rand(-shake, shake), rand(-shake, shake));
  drawBackground();

  for (const z of scorches) drawScorch(z);                // vết cháy nằm sát mặt sàn
  // Huyết Xung Kích: vùng máu hình đám mây nhiều thùy, nằm dưới các bóng
  for (const z of rings) drawBloodZone(z);
  for (const b of balls) if (b.alive && b.type === 'bolt') drawBoltFx(b);
  for (const z of thunders) drawThunder(z);
  for (const m of mines) drawMine(m);
  for (const tr of traps) drawTrap(tr);
  for (const s of supplies) drawSupply(s);
  for (const r of radios) drawRadio(r);
  for (const z of frostZones) drawFrostZone(z);
  for (const b of balls) if (b.alive) { if (b.stuckT > 0) { ctx.save(); ctx.globalAlpha = 0.4; drawBehind(b); ctx.restore(); } else drawBehind(b); }
  for (const b of balls) if (b.alive) { if (isBeam(b)) drawBeamHead(b); else drawBallBody(b); }
  for (const b of balls) if (b.alive && b.shockT > 0 && !isBeam(b)) drawShock(b);
  for (const b of balls) if (b.alive && b.burnT > 0 && !isBeam(b)) drawBurn(b);
  for (const b of balls) if (b.alive && b.frozenT > 0) drawFrozen(b);
  for (const b of balls) if (b.alive) { if (b.stuckT > 0) { ctx.save(); ctx.globalAlpha = 0.4; drawFront(b); ctx.restore(); } else drawFront(b); }
  for (const b of balls) if (b.alive && b.stuckT > 0) drawLocked(b);
  for (const tr of traps) if (tr.holder) drawTrapJaws(tr);
  for (const n of nets) drawNet(n);
  for (const j of jets) drawJet(j);
  for (const j of jets) if (j.life > 0) drawLock(j);
  for (const c of crystals) drawCrystal(c);
  for (const f of fireballs) drawFireball(f);

  // kiếm khí
  for (const w of waves) {
    ctx.save(); ctx.translate(w.x, w.y); ctx.rotate(w.a);
    ctx.shadowColor = 'rgba(140,220,255,.95)'; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.arc(0, 0, 26, -1.1, 1.1); ctx.arc(-11, 0, 26, 1.1, -1.1, true); ctx.closePath();
    const wg = ctx.createLinearGradient(-8, 0, 26, 0);
    wg.addColorStop(0, 'rgba(120,200,255,.35)'); wg.addColorStop(1, '#f2fbff');
    ctx.fillStyle = wg; ctx.fill();
    ctx.restore();
  }
  // lốc xoáy
  for (const t of tornados) {
    const fade = Math.min(1, t.life / 0.4);
    ctx.save(); ctx.translate(t.x, t.y);
    ctx.fillStyle = 'rgba(210,240,255,' + 0.07 * fade + ')';
    ctx.beginPath(); ctx.arc(0, 0, TORN_PULL, 0, Math.PI * 2); ctx.fill();
    ctx.save(); ctx.scale(TORN_R / 56, TORN_R / 56);                       // phễu lốc to ra theo bán kính chiêu
    for (let i = 0; i < 10; i++) {
      const k = i / 9, y = 36 - k * 76, w = 9 + k * 36, sx = Math.sin(t.spin + i * 0.9) * 5;
      ctx.strokeStyle = 'rgba(225,245,255,' + (0.85 - k * 0.4) * fade + ')';
      ctx.lineWidth = 3.2 - k;
      ctx.beginPath(); ctx.ellipse(sx, y, w, w * 0.27, 0, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
    ctx.restore();
  }
  // vụ nổ & vòng bảo vệ lúc bật
  for (const q of blasts) {
    const a = 1 - q.p;
    ctx.save();
    if (q.col === 'mine') drawMineBlast(q);
    else if (q.col === 'pulse') drawPulseBlast(q);
    else if (q.col === 'heal') {
      ctx.strokeStyle = 'rgba(125,255,155,' + a + ')'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.7 * a) + ')'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(q.x, q.y, q.r * 0.62, 0, Math.PI * 2); ctx.stroke();
    }
    else if (q.col === 'fire') {
      const fg = ctx.createRadialGradient(q.x, q.y, 0, q.x, q.y, q.r);
      fg.addColorStop(0, 'rgba(255,250,200,' + a + ')'); fg.addColorStop(0.5, 'rgba(255,160,40,' + 0.8 * a + ')'); fg.addColorStop(1, 'rgba(255,60,0,0)');
      ctx.fillStyle = fg; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.strokeStyle = 'rgba(150,220,255,' + a + ')'; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
  }

  for (const bl of bullets) {
    if (bl.boom && bl.nohome) { drawRocket(bl); continue; }   // đạn bazooka: thân xanh quân đội thuôn nhọn
    if (bl.boom) {                                       // đạn nổ: to hơn, có đuôi lửa
      const m0 = Math.hypot(bl.vx, bl.vy), ux = bl.vx / m0, uy = bl.vy / m0;
      ctx.lineCap = 'round';
      ctx.shadowColor = '#ff6a00'; ctx.shadowBlur = 16;
      ctx.strokeStyle = 'rgba(255,110,20,.85)'; ctx.lineWidth = 11;
      ctx.beginPath(); ctx.moveTo(bl.x - ux * 30, bl.y - uy * 30); ctx.lineTo(bl.x, bl.y); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffd36a'; ctx.beginPath(); ctx.arc(bl.x, bl.y, 8, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff6d0'; ctx.beginPath(); ctx.arc(bl.x + ux * 1.5, bl.y + uy * 1.5, 4, 0, Math.PI * 2); ctx.fill();
      continue;
    }
    const m = Math.hypot(bl.vx, bl.vy), tx = bl.vx / m * 16, ty = bl.vy / m * 16;
    ctx.lineCap = 'round';
    ctx.shadowColor = '#ffb300'; ctx.shadowBlur = 12;
    ctx.strokeStyle = '#ffc533'; ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(bl.x - tx, bl.y - ty); ctx.lineTo(bl.x, bl.y); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#fff8d6'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(bl.x - tx * 0.7, bl.y - ty * 0.7); ctx.lineTo(bl.x, bl.y); ctx.stroke();
  }

  for (const q of parts) {
    ctx.globalAlpha = clamp(q.life / q.max, 0, 1);
    ctx.fillStyle = q.col;
    ctx.beginPath(); ctx.arc(q.x, q.y, q.size, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (cfg.map === 'war') drawWarOverlay(); else if (cfg.map === 'elem') drawElemOverlay();

  ctx.font = '900 28px "Avenir Next","Segoe UI",Arial,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  for (const t of texts) {
    ctx.globalAlpha = clamp(t.life / t.max * 1.6, 0, 1);
    ctx.lineWidth = 7; ctx.strokeStyle = '#000'; ctx.strokeText(t.text, t.x, t.y);
    ctx.fillStyle = t.col; ctx.fillText(t.text, t.x, t.y);
  }
  ctx.globalAlpha = 1;
  drawCountdown();
  ctx.restore();
}

/* ---- ảnh xem trước trên thẻ chọn bóng ---- */
function drawPreview(canvas, side, type) {
  const saved = ctx;
  ctx = canvas.getContext('2d');
  const k = canvas.width / PV;
  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.clearRect(0, 0, PV, PV);
  const b = makeBall(side, type, 88, PV / 2, 0);
  b.sa = -0.5; b.sdir = 1; b.ga = 0; b.sh = 0; b.spin = 0.4;
  drawBehind(b); drawBallBody(b); drawFront(b);
  ctx = saved;
}

/* =====================================================================
   HUD & KẾT QUẢ
   ===================================================================== */
function buildHud() {
  const duo = cfg.mode === '2v2';
  $('hud').classList.toggle('duo', duo);
  hudRows = [];
  for (const side of ['blue', 'red']) {
    const col = $(side === 'blue' ? 'hudBlue' : 'hudRed');
    col.innerHTML = '';
    balls.filter(x => x.side === side).forEach((b, i) => {
      const row = document.createElement('div');
      row.className = 'hp';
      row.innerHTML = '<div class="name"><span class="nm"></span><span class="nu"></span></div><div class="bar"><i></i></div>';
      row.querySelector('.nm').textContent = sideName(side) + (duo ? ' ' + (i + 1) : '') + ' · ' + wname(b.type);
      col.appendChild(row);
      hudRows.push({ b, row, nu: row.querySelector('.nu'), fill: row.querySelector('.bar i') });
    });
  }
}
function updateHud() {
  for (const r of hudRows) {
    r.nu.textContent = Math.ceil(r.b.hp);
    r.fill.style.width = (r.b.hp / r.b.maxhp * 100) + '%';
    r.row.classList.toggle('dead', !r.b.alive);
  }
}
function showResult() {
  const sides = [...new Set(balls.filter(b => b.alive).map(b => b.side))];
  if (sides.length === 1) {
    const names = balls.filter(b => b.side === sides[0]).map(b => wname(b.type)).join(' + ');
    winText.textContent = t('wins', { side: sideName(sides[0]), names });
  } else winText.textContent = t('draw');
  overlay.classList.remove('hidden');
  Snd.music(null);
  Snd.play('win');
}

/* =====================================================================
   VÒNG LẶP
   ===================================================================== */
let last = performance.now();
function frame(now) {
  const real = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (view === 'battle') {
    if (state === 'ready') {
      readyT -= real;
      const c = Math.ceil(readyT);
      if (c !== lastCount && c >= 1) { lastCount = c; Snd.play('beep'); }
      if (readyT <= 0) { state = 'play'; goT = 0.8; Snd.play('go'); Snd.music(battleSong()); }
    }
    if (goT > 0) goT -= real;
    if (state === 'ko') {
      koTimer -= real;
      if (koTimer <= 0) { state = 'over'; timeScale = 1; showResult(); }
    }
    const total = real * speedMul * timeScale;
    const n = Math.max(1, Math.ceil(total / (1 / 120)));
    for (let i = 0; i < n; i++) step(total / n);
    updateHud();
    render();
  }
  requestAnimationFrame(frame);
}

   SỰ KIỆN
   ===================================================================== */

for (const id of ['mode1', 'mode2']) $(id).addEventListener('click', e => { Snd.init(); Snd.play('click'); startPicking(e.currentTarget.dataset.mode); });

speedBtn.addEventListener('click', () => {
  Snd.play('click');
  speedMul = speedMul === 1 ? 2 : speedMul === 2 ? 3 : 1;
  speedBtn.textContent = t('speed', { n: speedMul });
});
soundBtn.addEventListener('click', () => {
  Snd.init();
  Snd.setMuted(!Snd.muted);
  soundBtn.textContent = t('sound', { s: Snd.muted ? t('off') : t('on') });
  Snd.play('click');
});
window.addEventListener('keydown', e => { if ((e.key === 'r' || e.key === 'R') && view === 'battle') newGame(); });
window.addEventListener('resize', () => { if (view === 'battle') resize(); });

window.addEventListener('pointerdown', () => Snd.init(), { once: true });   // trình duyệt chỉ cho phát nhạc sau cú chạm đầu tiên
applyLang();
showMenu();
requestAnimationFrame(frame);

// phục vụ kiểm thử tự động
window.__game = {
  step, Snd, WEAPONS,
  start(bl, rd) { cfg.blue = [].concat(bl); cfg.red = [].concat(rd); cfg.mode = cfg.blue.length > 1 ? '2v2' : '1v1'; newGame(true); },
  get balls() { return balls; }, get rings() { return rings; }, get thunders() { return thunders; }, get tornados() { return tornados; }, get traps() { return traps; }, get nets() { return nets; }, get mines() { return mines; }, get fireballs() { return fireballs; }, get crystals() { return crystals; }, get frostZones() { return frostZones; }, get supplies() { return supplies; }, get radios() { return radios; }, get jets() { return jets; }, spawnSupply, spawnRadios, updateWar, setMap, mysteryRoll, get scorches() { return scorches; }, get bullets() { return bullets; }, get state() { return state; }, get view() { return view; },
  pick, startBattle, showSelect, showMenu, startPicking, setLang, showSettings, cfg, render, resize
};
})();
